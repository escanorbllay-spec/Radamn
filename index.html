<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radam Nox - Core Interface</title>
  <style>
    :root {
      --bg-main: #0a0a10;
      --bg-card: #12121e;
      --bg-input: #181828;
      --accent-purple: #8b5cf6;
      --accent-glow: #a78bfa;
      --user-msg: #2563eb;
      --border-color: #26263d;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Scrollbar Personalizada */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-main);
    }
    ::-webkit-scrollbar-thumb {
      background: #2d2d48;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-purple);
    }

    header {
      padding: 16px 20px;
      background: linear-gradient(180deg, #161626 0%, rgba(22, 22, 38, 0.8) 100%);
      border-bottom: 1px solid var(--border-color);
      text-align: center;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 1px;
      color: var(--accent-glow);
      text-transform: uppercase;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    header::before {
      content: '';
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
    }

    #chatContainer {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-break: break-word;
      animation: fadeIn 0.25s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user-msg {
      align-self: flex-end;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border-bottom-right-radius: 2px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .ai-msg {
      align-self: flex-start;
      background-color: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 2px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    }

    .chat-img {
      max-width: 100%;
      max-height: 240px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: block;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    #imagePreviewContainer {
      display: none;
      padding: 10px 20px;
      background-color: var(--bg-card);
      border-top: 1px solid var(--border-color);
      align-items: center;
      gap: 12px;
    }

    #imagePreview {
      max-height: 55px;
      border-radius: 8px;
      border: 1px solid var(--accent-purple);
    }

    .remove-btn {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .remove-btn:hover {
      background: #ef4444;
      color: white;
    }

    footer {
      padding: 14px 20px;
      background-color: #12121c;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input[type="text"] {
      flex: 1;
      padding: 13px 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-input);
      color: #ffffff;
      outline: none;
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.25);
    }

    button.action-btn {
      padding: 13px 20px;
      background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
      border: none;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.3);
    }

    button.action-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(139, 92, 246, 0.45);
    }

    button.action-btn:active {
      transform: translateY(0);
    }

    button.attach-btn {
      padding: 13px 15px;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.2s;
    }

    button.attach-btn:hover {
      border-color: var(--accent-purple);
      color: var(--accent-glow);
    }
  </style>
</head>
<body>

  <header>
    Radam Nox (Memória Ativa)
  </header>

  <div id="chatContainer"></div>

  <div id="imagePreviewContainer">
    <img id="imagePreview" src="" alt="Preview">
    <button type="button" class="remove-btn" onclick="clearSelectedImage()">✕ Remover</button>
  </div>

  <footer>
    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
    <button type="button" class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Anexar Imagem">📎</button>
    <input type="text" id="messageInput" placeholder="Pergunte qualquer coisa ao Radam Nox..." onkeypress="handleKeyPress(event)">
    <button type="button" class="action-btn" onclick="sendMessage()">Enviar</button>
  </footer>

  <script>
    const BACKEND_URL = "https://radamn.onrender.com";
    let selectedBase64Image = null;
    
    // Armazena todas as interações da sessão atual
    window.conversationHistory = [];

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        selectedBase64Image = e.target.result;
        document.getElementById('imagePreview').src = selectedBase64Image;
        document.getElementById('imagePreviewContainer').style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function clearSelectedImage() {
      selectedBase64Image = null;
      document.getElementById('fileInput').value = '';
      document.getElementById('imagePreviewContainer').style.display = 'none';
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    function renderMessage(text, imageBase64, isUser) {
      const chatContainer = document.getElementById('chatContainer');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${isUser ? 'user-msg' : 'ai-msg'}`;

      if (imageBase64) {
        const imgEl = document.createElement('img');
        imgEl.src = imageBase64;
        imgEl.className = 'chat-img';
        msgDiv.appendChild(imgEl);
      }

      if (text) {
        const textEl = document.createElement('p');
        textEl.textContent = text;
        msgDiv.appendChild(textEl);
      }

      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function sendMessage() {
      const inputEl = document.getElementById('messageInput');
      const messageText = inputEl.value.trim();

      if (!messageText && !selectedBase64Image) return;

      const currentImage = selectedBase64Image;
      renderMessage(messageText, currentImage, true);

      // Prepara a entrada do usuário
      let userEntryContent = messageText;
      if (currentImage) {
        userEntryContent = [];
        if (messageText) userEntryContent.push({ type: "text", text: messageText });
        userEntryContent.push({ type: "image_url", image_url: { url: currentImage } });
      }

      // Adiciona a mensagem atual ao histórico global
      window.conversationHistory.push({
        role: "user",
        content: userEntryContent
      });

      inputEl.value = '';
      clearSelectedImage();

      try {
        const endpoint = `${BACKEND_URL.replace(/\/$/, '')}/api/chat`;
        
        // Envia o array de histórico completo
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: window.conversationHistory,
            message: messageText
          })
        });

        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error || 'Erro na resposta do servidor.');
        }

        const reply = data.reply || data.message || data.text || 'Sem resposta recebida.';
        
        // Adiciona a resposta da IA ao histórico global
        window.conversationHistory.push({
          role: "assistant",
          content: reply
        });

        renderMessage(reply, null, false);
      } catch (err) {
        console.error('Erro de conexão:', err);
        renderMessage(`Erro do Servidor: ${err.message || 'Não foi possível conectar ao Radam Nox.'}`, null, false);
      }
    }
  </script>
</body>
</html>
