<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Radam Nox - AI Interface</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #000000;
      --sidebar-bg: #0a0a0c;
      --card-bg: #111115;
      --text-color: #f3f4f6;
      --text-muted: #8b949e;
      --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 50%, #06b6d4 100%);
      --accent-purple: #8b5cf6;
      --user-msg: #1d4ed8;
      --bot-msg: #121217;
      --border-color: rgba(255, 255, 255, 0.12);
      --sidebar-width: 280px;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow: hidden;
    }

    body { display: flex; width: 100vw; position: relative; }

    /* Overlay */
    .sidebar-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100dvh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 900;
      display: none;
    }
    .sidebar-overlay.active {
      display: block;
    }

    /* Sidebar Flutuante */
    .sidebar {
      position: fixed;
      top: 0; left: 0;
      height: 100dvh;
      width: var(--sidebar-width);
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 1000;
    }

    .sidebar.active { transform: translateX(0); }

    .sidebar-header {
      padding: 1.2rem 1rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.2rem;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .new-chat-btn {
      width: 100%;
      padding: 0.8rem;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-radius: 12px;
      color: #c4b5fd;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      cursor: pointer;
    }

    .chat-history-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.8rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .history-item {
      padding: 0.7rem 0.9rem;
      border-radius: 10px;
      font-size: 0.88rem;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .history-item.active {
      background: var(--card-bg);
      color: var(--text-color);
    }

    /* Container Principal */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    header {
      padding: 0.8rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
      z-index: 10;
    }

    .menu-toggle {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 1.3rem;
      cursor: pointer;
      padding: 0.5rem;
    }

    .model-select {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      outline: none;
    }

    /* Área de Chat */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .welcome-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto 0;
      text-align: center;
      padding: 1rem 0.5rem;
    }

    .welcome-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: white;
      margin-bottom: 1rem;
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.35);
    }

    .welcome-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 0.4rem;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome-subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .suggestions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.8rem;
      width: 100%;
      max-width: 500px;
    }

    @media (max-width: 480px) {
      .suggestions-grid { grid-template-columns: 1fr; }
    }

    .suggestion-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 0.9rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .card-icon { font-size: 1.2rem; color: #a78bfa; }
    .card-text { font-size: 0.85rem; color: var(--text-color); font-weight: 500; }

    /* Mensagens */
    .message-row {
      display: flex;
      gap: 0.8rem;
      width: 100%;
      max-width: 90%;
    }

    .user-row { align-self: flex-end; flex-direction: row-reverse; }
    .bot-row { align-self: flex-start; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .bot-avatar {
      background: var(--accent-gradient);
      color: white;
    }

    .message-body {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .message {
      padding: 0.9rem 1.1rem;
      border-radius: 18px;
      line-height: 1.5;
      word-break: break-word;
      font-size: 0.95rem;
    }

    .user-message {
      background-color: var(--user-msg);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .bot-message {
      background-color: var(--bot-msg);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
    }

    .msg-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.2rem;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 0.2rem 0.4rem;
    }

    /* Input */
    #input-container {
      padding: 0.8rem 1rem 1.2rem 1rem;
      background: var(--bg-color);
      flex-shrink: 0;
      width: 100%;
      z-index: 10;
    }

    .attachment-preview {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.4rem;
    }

    .preview-item {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .preview-item img { width: 100%; height: 100%; object-fit: cover; }

    .chat-form {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background-color: #0c0c10;
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 0.4rem 0.8rem;
    }

    textarea {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-color);
      outline: none;
      resize: none;
      max-height: 100px;
      font-size: 0.95rem;
      padding: 0.4rem 0;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="brand-title">Radam Nox</span>
      <button type="button" class="menu-toggle" id="btn-close-sidebar"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div style="padding: 0.8rem;">
      <button type="button" class="new-chat-btn" id="btn-new-chat"><i class="fa-solid fa-plus"></i> Novo Chat</button>
    </div>
    <div class="chat-history-list" id="chat-history-list"></div>
  </aside>

  <div class="main-container">
    <header>
      <div style="display: flex; align-items: center; gap: 0.8rem;">
        <button type="button" class="menu-toggle" id="btn-open-sidebar"><i class="fa-solid fa-bars"></i></button>
        <span class="brand-title">Radam Nox</span>
      </div>
      <select class="model-select" id="model-select">
        <option value="radam-nox-fast">Nox Fast</option>
        <option value="radam-nox-thinker">Nox Thinker</option>
      </select>
    </header>

    <div id="chat-container">
      <div class="welcome-hero" id="welcome-hero">
        <div class="welcome-icon"><i class="fa-solid fa-bolt"></i></div>
        <h1 class="welcome-title">Olá, Blay</h1>
        <p class="welcome-subtitle">Como posso te ajudar no Radam Nox hoje?</p>
        
        <div class="suggestions-grid">
          <div class="suggestion-card" data-prompt="Escreva um script de automação em Python">
            <i class="fa-solid fa-code card-icon"></i>
            <span class="card-text">Criar script em Python</span>
          </div>
          <div class="suggestion-card" data-prompt="Analise uma arquitetura de microsserviços para o meu backend">
            <i class="fa-solid fa-network-wired card-icon"></i>
            <span class="card-text">Arquitetura de Software</span>
          </div>
          <div class="suggestion-card" data-prompt="Pesquise e resuma as principais novidades de IA">
            <i class="fa-solid fa-globe card-icon"></i>
            <span class="card-text">Pesquisa Web em Tempo Real</span>
          </div>
          <div class="suggestion-card" data-prompt="Ajude a revisar e otimizar meu código no GitHub">
            <i class="fa-solid fa-bug card-icon"></i>
            <span class="card-text">Revisar e Refatorar Código</span>
          </div>
        </div>
      </div>
    </div>

    <div id="input-container">
      <div class="attachment-preview" id="attachment-preview"></div>
      
      <form class="chat-form" id="chat-form" onsubmit="return false;">
        <button type="button" class="icon-btn" id="btn-attach" title="Anexar arquivo">
          <i class="fa-solid fa-paperclip"></i>
        </button>
        <button type="button" class="icon-btn" id="btn-camera" title="Tirar foto">
          <i class="fa-solid fa-camera"></i>
        </button>
        
        <textarea id="user-input" rows="1" placeholder="Pergunte qualquer coisa ao Radam Nox..."></textarea>

        <button type="button" class="icon-btn" id="btn-mic" title="Voz">
          <i class="fa-solid fa-microphone"></i>
        </button>

        <button type="button" class="icon-btn" id="btn-send" style="color: #a78bfa;">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
      </form>
    </div>
  </div>

  <input type="file" id="file-input" multiple>
  <input type="file" id="camera-input" accept="image/*" capture="environment">

  <script>
    // Função universal para ligar eventos de toque e clique sem bloqueio
    function addMobileListener(element, callback) {
      if (!element) return;
      let handled = false;
      
      element.addEventListener('touchend', (e) => {
        e.preventDefault();
        handled = true;
        callback(e);
      }, { passive: false });

      element.addEventListener('click', (e) => {
        if (!handled) {
          callback(e);
        }
        handled = false;
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      const API_URL = "https://radamanthys-core.onrender.com/api/chat";
      let selectedFiles = [];

      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebar-overlay");
      const btnOpenSidebar = document.getElementById("btn-open-sidebar");
      const btnCloseSidebar = document.getElementById("btn-close-sidebar");
      const btnNewChat = document.getElementById("btn-new-chat");
      const chatHistoryList = document.getElementById("chat-history-list");
      
      const chatContainer = document.getElementById("chat-container");
      const userInput = document.getElementById("user-input");
      const btnSend = document.getElementById("btn-send");
      const attachmentPreview = document.getElementById("attachment-preview");

      const fileInput = document.getElementById("file-input");
      const cameraInput = document.getElementById("camera-input");
      const btnAttach = document.getElementById("btn-attach");
      const btnCamera = document.getElementById("btn-camera");
      const btnMic = document.getElementById("btn-mic");

      // Sidebar
      function setSidebarState(open) {
        if (open) {
          sidebar.classList.add("active");
          overlay.classList.add("active");
        } else {
          sidebar.classList.remove("active");
          overlay.classList.remove("active");
        }
      }

      addMobileListener(btnOpenSidebar, () => setSidebarState(true));
      addMobileListener(btnCloseSidebar, () => setSidebarState(false));
      addMobileListener(overlay, () => setSidebarState(false));

      // Novo Chat
      addMobileListener(btnNewChat, () => {
        chatContainer.innerHTML = `
          <div class="welcome-hero" id="welcome-hero">
            <div class="welcome-icon"><i class="fa-solid fa-bolt"></i></div>
            <h1 class="welcome-title">Olá, Blay</h1>
            <p class="welcome-subtitle">Como posso te ajudar no Radam Nox hoje?</p>
            <div class="suggestions-grid">
              <div class="suggestion-card" data-prompt="Escreva um script de automação em Python">
                <i class="fa-solid fa-code card-icon"></i>
                <span class="card-text">Criar script em Python</span>
              </div>
              <div class="suggestion-card" data-prompt="Analise uma arquitetura de microsserviços para o meu backend">
                <i class="fa-solid fa-network-wired card-icon"></i>
                <span class="card-text">Arquitetura de Software</span>
              </div>
              <div class="suggestion-card" data-prompt="Pesquise e resuma as principais novidades de IA">
                <i class="fa-solid fa-globe card-icon"></i>
                <span class="card-text">Pesquisa Web em Tempo Real</span>
              </div>
              <div class="suggestion-card" data-prompt="Ajude a revisar e otimizar meu código no GitHub">
                <i class="fa-solid fa-bug card-icon"></i>
                <span class="card-text">Revisar e Refatorar Código</span>
              </div>
            </div>
          </div>`;
        bindCardClicks();
        setSidebarState(false);
      });

      function bindCardClicks() {
        document.querySelectorAll(".suggestion-card").forEach(card => {
          addMobileListener(card, () => {
            userInput.value = card.getAttribute("data-prompt");
            handleSendMessage();
          });
        });
      }
      bindCardClicks();

      // Ajuste automático da caixa de texto
      userInput.addEventListener("input", () => {
        userInput.style.height = "auto";
        userInput.style.height = Math.min(userInput.scrollHeight, 100) + "px";
      });

      userInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          handleSendMessage();
        }
      });

      // Botão de Envio
      addMobileListener(btnSend, () => handleSendMessage());

      // Anexos e Câmara
      addMobileListener(btnAttach, () => fileInput.click());
      addMobileListener(btnCamera, () => cameraInput.click());

      fileInput.addEventListener("change", handleFileSelect);
      cameraInput.addEventListener("change", handleFileSelect);

      function handleFileSelect(e) {
        const files = Array.from(e.target.files);
        files.forEach(file => {
          selectedFiles.push(file);
          const reader = new FileReader();
          reader.onload = (event) => {
            const div = document.createElement("div");
            div.className = "preview-item";
            div.innerHTML = `<img src="${event.target.result}" alt="preview">`;
            attachmentPreview.appendChild(div);
          };
          reader.readAsDataURL(file);
        });
      }

      // Reconhecimento de Voz
      addMobileListener(btnMic, () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("O navegador do seu telemóvel não suporta gravação de voz.");
          return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'pt-BR';
        recognition.start();

        btnMic.style.color = "#ef4444";
        recognition.onresult = (e) => {
          userInput.value += e.results[0][0].transcript;
          btnMic.style.color = "var(--text-muted)";
        };
        recognition.onerror = () => btnMic.style.color = "var(--text-muted)";
        recognition.onend = () => btnMic.style.color = "var(--text-muted)";
      });

      // Envio de Mensagem
      async function handleSendMessage() {
        const text = userInput.value.trim();
        if (!text && selectedFiles.length === 0) return;

        const welcomeHero = document.getElementById("welcome-hero");
        if (welcomeHero) welcomeHero.remove();

        const historyItem = document.createElement("div");
        historyItem.className = "history-item active";
        historyItem.innerHTML = `<i class="fa-regular fa-message"></i> <span>${text}</span>`;
        chatHistoryList.prepend(historyItem);

        appendUserMessage(text, selectedFiles);

        userInput.value = "";
        userInput.style.height = "auto";
        attachmentPreview.innerHTML = "";
        selectedFiles = [];

        const loadingRow = document.createElement("div");
        loadingRow.className = "message-row bot-row";
        loadingRow.innerHTML = `
          <div class="avatar bot-avatar"><i class="fa-solid fa-bolt"></i></div>
          <div class="message-body">
            <div class="message bot-message" style="color: var(--text-muted);">Radam Nox a pensar...</div>
          </div>`;
        chatContainer.appendChild(loadingRow);
        scrollToBottom();

        try {
          const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
          });

          const data = await res.json();
          loadingRow.remove();

          const botReply = data.reply || data.response || data.message || "Processado com sucesso!";
          typeBotResponse(botReply);

        } catch (err) {
          loadingRow.remove();
          typeBotResponse("⚠️ Servidor indisponível no mom
