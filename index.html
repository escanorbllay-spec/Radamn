<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Radam Nox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #050508;
      --panel-bg: #111118;
      --card-bg: #181824;
      --purple-accent: #7c3aed;
      --purple-glow: rgba(124, 58, 237, 0.5);
      --user-msg: #2563eb;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: rgba(255, 255, 255, 0.1);
      touch-action: manipulation;
    }

    body {
      width: 100vw;
      height: 100dvh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* BOTOES E CLIQUES */
    button, .btn-action, .tool-card, .dropdown-item {
      cursor: pointer !important;
      pointer-events: auto !important;
      user-select: none;
      -webkit-user-select: none;
    }

    /* HEADER */
    header {
      padding: 14px 18px;
      background: #111118;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 100;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-action {
      background: #181824;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 1.1rem;
      padding: 10px 14px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-action:active {
      background: var(--purple-accent);
    }

    .title-area {
      font-weight: 700;
      font-size: 1.05rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
    }

    /* DROPDOWN SUPERIOR */
    #topMenuDropdown {
      display: none;
      position: absolute;
      top: 60px;
      right: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 8px;
      z-index: 500;
      flex-direction: column;
      min-width: 180px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .dropdown-item {
      padding: 12px;
      font-size: 0.9rem;
      color: var(--text-main);
      border: none;
      background: transparent;
      text-align: left;
      border-radius: 8px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dropdown-item:active {
      background: rgba(255, 255, 255, 0.1);
    }

    /* SIDEBAR */
    #sidebarOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      z-index: 900;
    }

    #sidebar {
      position: fixed;
      top: 0; left: -290px;
      width: 290px; height: 100%;
      background: #0a0a10;
      border-right: 1px solid var(--border-color);
      z-index: 1000;
      transition: left 0.25s ease;
      padding: 18px;
      display: flex;
      flex-direction: column;
    }

    /* MAIN / BOAS-VINDAS */
    #mainArea {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      gap: 15px;
      overflow-y: auto;
    }

    .welcome-title {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(180deg, #ffffff 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ÁREA DE CHAT */
    #chatContainer {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .msg-user {
      align-self: flex-end;
      background: var(--user-msg);
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 80%;
      word-break: break-word;
    }

    .msg-ai {
      align-self: flex-start;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 85%;
      word-break: break-word;
      line-height: 1.4;
    }

    .msg-loading {
      align-self: flex-start;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-style: italic;
    }

    .msg-preview-img {
      max-width: 200px;
      max-height: 200px;
      border-radius: 8px;
      margin-bottom: 6px;
      display: block;
    }

    /* MODAL DE ANEXOS (+) */
    #toolsModalOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 950;
      align-items: flex-end;
    }

    #toolsModal {
      width: 100%;
      background: #111118;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px 20px 35px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .tool-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 16px 8px;
      border-radius: 16px;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .tool-card svg {
      width: 26px;
      height: 26px;
      stroke: #a855f7;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    /* BARRA DE PREVIEW */
    #attachmentPreviewBar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: #181824;
      border-top: 1px solid var(--border-color);
      font-size: 0.85rem;
      color: var(--text-muted);
      z-index: 100;
    }

    /* FOOTER */
    footer {
      padding: 12px 12px 25px 12px;
      background: #111118;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
      position: relative;
      z-index: 200;
      flex-shrink: 0;
      width: 100%;
      align-items: center;
    }

    .input-bar {
      flex: 1;
      display: flex;
      align-items: center;
      background: #08080d;
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 4px 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: white;
      outline: none;
      font-size: 0.95rem;
    }

    .btn-dynamic {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: var(--purple-accent);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .btn-dynamic.waves {
      background: #1d1b26;
      color: #a855f7;
      font-size: 1.1rem;
      letter-spacing: -2px;
    }

    .btn-dynamic.stop {
      background: #262636;
      color: #ffffff;
      border: 1px solid var(--border-color);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- OVERLAY E SIDEBAR -->
  <div id="sidebarOverlay"></div>
  <div id="sidebar">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h3 style="color:#fff;">Radam Nox</h3>
      <button class="btn-action" id="btnCloseSidebar">✕</button>
    </div>
    <button class="btn-action" id="btnNewChat" style="width:100%; margin-bottom:15px; background:var(--purple-accent);">+ Nova conversa</button>
    <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:10px;">RECENTES</div>
    <button class="btn-action" id="btnHist1" style="margin-bottom:8px; text-align:left; width:100%;">💻 Análise de Código</button>
  </div>

  <!-- HEADER -->
  <header>
    <div class="header-left">
      <button class="btn-action" id="btnOpenSidebar">☰</button>
      <div class="title-area">
        <div class="status-dot"></div>
        Radam Nox
      </div>
    </div>
    <button class="btn-action" id="btnTopMenu">⋮</button>

    <!-- MENU DROPDOWN -->
    <div id="topMenuDropdown">
      <button class="dropdown-item" id="btnActionShare">🔗 Compartilhar</button>
      <button class="dropdown-item" id="btnActionRename">✏️ Renomear</button>
      <button class="dropdown-item" id="btnActionDelete" style="color:#f87171;">🗑 Excluir conversa</button>
    </div>
  </header>

  <!-- TELA INICIAL -->
  <div id="mainArea">
    <div class="welcome-title">RADAM NOX</div>
    <p style="color:var(--text-muted)">Boas-vindas! No que posso ajudar?</p>
  </div>

  <!-- CONTAINER DE MENSAGENS DO CHAT -->
  <div id="chatContainer"></div>

  <!-- MODAL DE ANEXOS (+) -->
  <div id="toolsModalOverlay">
    <div id="toolsModal">
      <div style="font-size:0.8rem; color:var(--text-muted); font-weight:600;">ANEXOS E FERRAMENTAS</div>
      <div class="tool-grid">
        
        <div class="tool-card" id="btnToolPhoto">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" ry="5"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
          <span>Fotos</span>
        </div>

        <div class="tool-card" id="btnToolCamera">
          <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
          <span>Câmera</span>
        </div>

        <div class="tool-card" id="btnToolFile">
          <svg viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
          <span>Arquivos</span>
        </div>

        <div class="tool-card" id="btnToolDrive">
          <svg viewBox="0 0 24 24"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></svg>
          <span>Drive</span>
        </div>

      </div>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*,application/pdf,text/*" style="display:none;">

  <!-- BARRA DE PREVIEW -->
  <div id="attachmentPreviewBar">
    <span id="attachmentFileName"></span>
    <button id="btnRemoveAttachment" style="background:none; border:none; color:#f87171; font-size:1rem; margin-left:auto;">✕</button>
  </div>

  <!-- FOOTER -->
  <footer>
    <div class="input-bar">
      <button class="btn-action" id="btnOpenTools" style="border:none; background:transparent;">+</button>
      <input type="text" id="messageInput" placeholder="Peça ao Radam Nox...">
    </div>
    <button class="btn-dynamic waves" id="btnActionDynamic">❙❚❙</button>
  </footer>

  <script>
    const BACKEND_URL = "https://radamn.onrender.com";
    window.conversationHistory = [];
    let isProcessing = false;
    let abortController = null;
    let pendingAttachment = null;

    // AÇÃO DE TOQUE HÍBRIDA (SUPORTA TOUCH E CLICK SEM ATRASO)
    function attachTrigger(element, fn) {
      if (!element) return;
      let handled = false;
      const handler = function(e) {
        if (e.type === 'touchstart') handled = true;
        else if (e.type === 'click' && handled) {
          handled = false;
          return;
        }
        fn(e);
      };
      element.addEventListener('touchstart', handler, { passive: true });
      element.addEventListener('click', handler);
    }

    function saveHistoryToStorage() {
      try {
        localStorage.setItem('radam_nox_history', JSON.stringify(window.conversationHistory));
      } catch (e) {}
    }

    function loadHistoryFromStorage() {
      try {
        const saved = localStorage.getItem('radam_nox_history');
        if (saved) {
          window.conversationHistory = JSON.parse(saved);
          if (window.conversationHistory.length > 0) renderFullHistory();
        }
      } catch (e) {}
    }

    function renderFullHistory() {
      const chatContainer = document.getElementById('chatContainer');
      const mainArea = document.getElementById('mainArea');
      chatContainer.innerHTML = "";

      if (window.conversationHistory.length === 0) {
        chatContainer.style.display = "none";
        mainArea.style.display = "flex";
        return;
      }

      mainArea.style.display = "none";
      chatContainer.style.display = "flex";

      window.conversationHistory.forEach(item => {
        const div = document.createElement('div');
        div.className = item.role === 'user' ? 'msg-user' : 'msg-ai';

        let htmlContent = '';
        if (item.image) htmlContent += `<img src="${item.image}" class="msg-preview-img"><br>`;
        htmlContent += item.content || '';
        div.innerHTML = htmlContent;

        chatContainer.appendChild(div);
      });

      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function updateButtonState() {
      const btn = document.getElementById('btnActionDynamic');
      const input = document.getElementById('messageInput');
      if (!btn || !input) return;

      if (isProcessing) {
        btn.className = "btn-dynamic stop";
        btn.innerHTML = "⏹";
      } else if (input.value.trim().length > 0 || pendingAttachment) {
        btn.className = "btn-dynamic";
        btn.innerHTML = "↑";
      } else {
        btn.className = "btn-dynamic waves";
        btn.innerHTML = "❙❚❙";
      }
    }

    function openSidebar() {
      document.getElementById('sidebar').style.left = "0px";
      document.getElementById('sidebarOverlay').style.display = "block";
    }

    function closeSidebar() {
      document.getElementById('sidebar').style.left = "-290px";
      document.getElementById('sidebarOverlay').style.display = "none";
    }

    function clearAttachment() {
      pendingAttachment = null;
      document.getElementById('fileInput').value = '';
      document.getElementById('attachmentPreviewBar').style.display = 'none';
      updateButtonState();
    }

    function resetChat() {
      window.conversationHistory = [];
      localStorage.removeItem('radam_nox_history');
      const chatContainer = document.getElementById('chatContainer');
      chatContainer.innerHTML = "";
      chatContainer.style.display = "none";
      document.getElementById('mainArea').style.display = "flex";
      isProcessing = false;
      clearAttachment();
      updateButtonState();
    }

    async function send(textToSend) {
      const input = document.getElementById('messageInput');
      const chatContainer = document.getElementById('chatContainer');
      const mainArea = document.getElementById('mainArea');
      const txt = textToSend || input.value.trim();

      if (!txt && !pendingAttachment && !isProcessing) return;

      if (isProcessing) {
        if (abortController) abortController.abort();
        isProcessing = false;
        updateButtonState();
        return;
      }

      isProcessing = true;
      updateButtonState();

      mainArea.style.display = "none";
      chatContainer.style.display = "flex";

      const userDiv = document.createElement('div');
      userDiv.className = "msg-user";

      let userHtml = '';
      let currentAttachment = pendingAttachment;

      if (currentAttachment && currentAttachment.mimeType.startsWith('image/')) {
        userHtml += `<img src="${currentAttachment.base64}" class="msg-preview-img"><br>`;
      } else if (currentAttachment) {
        userHtml += `<div style="font-size:0.8rem; opacity:0.8;">📎 ${currentAttachment.name}</div>`;
      }

      userHtml += txt;
      userDiv.innerHTML = userHtml;
      chatContainer.appendChild(userDiv);

      window.conversationHistory.push({
        role: "user",
        content: txt,
        image: currentAttachment ? currentAttachment.base64 : null
      });
      saveHistoryToStorage();

      input.value = "";
      clearAttachment();
      chatContainer.scrollTop = chatContainer.scrollHeight;

      const loadingDiv = document.createElement('div');
      loadingDiv.className = "msg-loading";
      loadingDiv.innerText = "Radam Nox está pensando...";
      chatContainer.appendChild(loadingDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      abortController = new AbortController();

      try {
        const endpoint = `${BACKEND_URL.replace(/\/$/, '')}/api/chat`;
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: window.conversationHistory,
            message: txt,
            attachment: currentAttachment
          }),
          signal: abortController.signal
        });

        if (chatContainer.contains(loadingDiv)) {
          chatContainer.removeChild(loadingDiv);
        }

        if (!response.ok) throw new Error(`Status ${response.status}`);

        const data = await response.json();
        const reply = data.reply || data.response || data.message || data.text || "Sem resposta.";

        window.conversationHistory.push({ role: "assistant", content: reply });
        saveHistoryToStorage();

        const aiDiv = document.createElement('div');
        aiDiv.className = "msg-ai";
        aiDiv.innerText = reply;
        chatContainer.appendChild(aiDiv);

      } catch (err) {
        if (chatContainer.contains(loadingDiv)) {
          chatContainer.removeChild(loadingDiv);
        }
        if (err.name !== 'AbortError') {
          const errDiv = document.createElement('div');
          errDiv.className = "msg-ai";
          errDiv.style.borderColor = "#f87171";
          errDiv.innerText = `Erro ao conectar. (${err.message})`;
          chatContainer.appendChild(errDiv);
        }
      }

      isProcessing = false;
      updateButtonState();
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // VINCULAÇÃO DOS EVENTOS NATIVOS
    document.addEventListener('DOMContentLoaded', function() {
      loadHistoryFromStorage();

      attachTrigger(document.getElementById('btnOpenSidebar'), openSidebar);
      attachTrigger(document.getElementById('btnCloseSidebar'), closeSidebar);
      attachTrigger(document.getElementById('sidebarOverlay'), closeSidebar);

      attachTrigger(document.getElementById('btnNewChat'), function() {
        closeSidebar();
        resetChat();
      });

      attachTrigger(document.getElementById('btnHist1'), function() {
        closeSidebar();
        send("Análise de código");
      });

      const topMenuDropdown = document.getElementById('topMenuDropdown');
      attachTrigger(document.getElementById('btnTopMenu'), function(e) {
        e.stopPropagation();
        topMenuDropdown.style.display = (topMenuDropdown.style.display === "flex") ? "none" : "flex";
      });

      document.addEventListener('click', function(e) {
        if (topMenuDropdown.style.display === "flex" && !e.target.closest('#btnTopMenu')) {
          topMenuDropdown.style.display = "none";
        }
      });

      attachTrigger(document.
