  <script>
    const API_URL = "https://radamanthys-core.onrender.com/api/chat";
    let selectedFiles = [];
    let isRecording = false;

    // Controlo da Sidebar
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("sidebar-overlay");
    
    document.getElementById("btn-open-sidebar").addEventListener("click", () => {
      sidebar.classList.add("active");
      overlay.classList.add("active");
    });
    
    document.getElementById("btn-close-sidebar").addEventListener("click", () => {
      sidebar.classList.remove("active");
      overlay.classList.remove("active");
    });

    overlay.addEventListener("click", () => {
      sidebar.classList.remove("active");
      overlay.classList.remove("active");
    });

    // Novo Chat
    document.getElementById("btn-new-chat").addEventListener("click", () => {
      document.getElementById("chat-container").innerHTML = `
        <div class="welcome-hero" id="welcome-hero">
          <div class="welcome-icon"><i class="fa-solid fa-bolt"></i></div>
          <h1 class="welcome-title">Olá, Blay</h1>
          <p class="welcome-subtitle">Como posso te ajudar no Radam Nox hoje?</p>
          <div class="suggestions-grid">
            <div class="suggestion-card" data-prompt="Escreva um script de automação em Python">
              <i class="fa-solid fa-code card-icon"></i>
              <span class="card-text">Criar script em Python</span>
            </div>
            <div class="suggestion-card" data-prompt="Analise uma arquitetura de microsserviços para o meu backend">
              <i class="fa-solid fa-network-wired card-icon"></i>
              <span class="card-text">Arquitetura de Software</span>
            </div>
            <div class="suggestion-card" data-prompt="Pesquise e resuma as principais novidades de IA">
              <i class="fa-solid fa-globe card-icon"></i>
              <span class="card-text">Pesquisa Web em Tempo Real</span>
            </div>
            <div class="suggestion-card" data-prompt="Ajude a revisar e otimizar meu código no GitHub">
              <i class="fa-solid fa-bug card-icon"></i>
              <span class="card-text">Revisar e Refatorar Código</span>
            </div>
          </div>
        </div>`;
      bindCards();
      sidebar.classList.remove("active");
      overlay.classList.remove("active");
    });

    // Cards de Sugestão
    function bindCards() {
      document.querySelectorAll(".suggestion-card").forEach(card => {
        card.addEventListener("click", () => {
          document.getElementById("user-input").value = card.getAttribute("data-prompt");
          sendMessage();
        });
      });
    }
    bindCards();

    // Auto-resize textarea
    const userInput = document.getElementById("user-input");
    userInput.addEventListener("input", function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });

    // Envio por Enter
    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Envio pelo botão de seta
    document.getElementById("send-btn").addEventListener("click", sendMessage);

    // Funcionalidades Reais de Hardware Móvel
    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.multiple = true;
    fileInput.onchange = (e) => handleFiles(e.target.files);

    const cameraInput = document.createElement("input");
    cameraInput.type = "file";
    cameraInput.accept = "image/*";
    cameraInput.capture = "environment";
    cameraInput.onchange = (e) => handleFiles(e.target.files);

    document.getElementById("btn-attach").addEventListener("click", () => fileInput.click());
    document.getElementById("btn-camera").addEventListener("click", () => cameraInput.click());

    function handleFiles(files) {
      const previewContainer = document.getElementById("attachment-preview") || createPreviewContainer();
      Array.from(files).forEach(file => {
        selectedFiles.push(file);
        const reader = new FileReader();
        reader.onload = (ev) => {
          const div = document.createElement("div");
          div.className = "preview-item";
          div.innerHTML = `<img src="${ev.target.result}" alt="preview">`;
          previewContainer.appendChild(div);
        };
        reader.readAsDataURL(file);
      });
    }

    function createPreviewContainer() {
      const container = document.createElement("div");
      container.id = "attachment-preview";
      container.className = "attachment-preview";
      document.getElementById("input-container").prepend(container);
      return container;
    }

    // Microfone por Voz Real
    document.getElementById("btn-mic").addEventListener("click", () => {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert("O seu navegador não suporta reconhecimento de voz.");
        return;
      }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';

      const micBtn = document.getElementById("btn-mic");
      if (!isRecording) {
        recognition.start();
        isRecording = true;
        micBtn.style.color = "red";
      }

      recognition.onresult = (event) => {
        userInput.value += event.results[0][0].transcript;
        micBtn.style.color = "var(--text-muted)";
        isRecording = false;
      };

      recognition.onerror = () => {
        micBtn.style.color = "var(--text-muted)";
        isRecording = false;
      };
    });

    // Função de Envio Principal
    async function sendMessage() {
      const messageText = userInput.value.trim();
      const chatContainer = document.getElementById("chat-container");
      
      if (!messageText && selectedFiles.length === 0) return;

      const welcomeHero = document.getElementById("welcome-hero");
      if (welcomeHero) welcomeHero.remove();

      appendMessage(messageText, "user-message", selectedFiles);
      userInput.value = "";
      userInput.style.height = "auto";
      
      const preview = document.getElementById("attachment-preview");
      if (preview) preview.innerHTML = "";
      selectedFiles = [];

      const loadingDiv = appendMessage("Radam Nox a pensar...", "bot-message");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: messageText })
        });

        const data = await response.json();
        loadingDiv.remove();

        let textToShow = data.reply || data.response || data.message || (typeof data === "string" ? data : JSON.stringify(data));
        appendMessage(textToShow, "bot-message");

      } catch (error) {
        if (loadingDiv) loadingDiv.remove();
        appendMessage("⚠️ Erro de conexão com o motor Render. Tente novamente.", "bot-message");
      }
    }

    function appendMessage(content, className, files = []) {
      const chatContainer = document.getElementById("chat-container");
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${className}`;
      
      let filesHtml = "";
      files.forEach(f => {
        filesHtml += `<br><img src="${URL.createObjectURL(f)}" style="max-width:180px; border-radius:8px; margin-top:5px;">`;
      });

      msgDiv.innerHTML = content + filesHtml;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgDiv;
    }
  </script>
