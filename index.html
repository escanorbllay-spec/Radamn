<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radamn AI — Gateway Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-black text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-indigo-500/30">

    <!-- Overlay & Drawer Side Menu -->
    <div id="drawer-overlay" onclick="toggleDrawer()" class="fixed inset-0 bg-black/80 backdrop-blur-md z-40 hidden transition-opacity"></div>
    <aside id="drawer" class="fixed top-0 left-0 bottom-0 w-72 bg-slate-950 border-r border-slate-800/80 z-50 transform -translate-x-full transition-transform duration-300 ease-in-out p-4 flex flex-col justify-between shadow-2xl">
        <div class="space-y-6">
            <div class="flex items-center justify-between pb-4 border-b border-slate-800/80">
                <div class="flex items-center space-x-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 animate-pulse"></span>
                    <span class="font-bold text-sm tracking-widest uppercase text-white">Radamn AI</span>
                </div>
                <button onclick="toggleDrawer()" type="button" class="text-slate-400 hover:text-white p-2 rounded-lg transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <nav class="space-y-2">
                <button onclick="novoProjeto(); toggleDrawer();" type="button" class="w-full flex items-center justify-center space-x-2 px-3 py-2.5 rounded-xl bg-white text-black font-semibold text-xs hover:bg-slate-200 transition shadow-sm">
                    <i class="fa-solid fa-plus text-xs"></i> <span>Criar Novo Projeto</span>
                </button>
                <div class="pt-4">
                    <p class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider px-3 mb-2">Painel de Segurança</p>
                    <div class="px-3 py-2 rounded-xl text-xs text-slate-300 bg-slate-900/80 border border-slate-800 flex items-center space-x-2">
                        <i class="fa-solid fa-shield-halved text-emerald-400"></i>
                        <span>Master Key: Ativa</span>
                    </div>
                </div>
            </nav>
        </div>

        <div class="pt-4 border-t border-slate-800/80 text-[11px] text-slate-500 flex items-center justify-between">
            <span>Vercel Platform</span>
            <span class="text-indigo-400 font-mono">v0.dev Style</span>
        </div>
    </aside>

    <!-- Header -->
    <header class="flex items-center justify-between px-4 py-3 border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-md sticky top-0 z-30">
        <div class="flex items-center space-x-3">
            <button onclick="toggleDrawer()" type="button" class="text-slate-300 hover:text-white p-2 rounded-xl border border-slate-800 bg-slate-900/60 active:scale-95 transition">
                <i class="fa-solid fa-bars text-sm"></i>
            </button>
            <div class="flex items-center space-x-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <h1 class="font-bold text-sm md:text-base tracking-wide text-white flex items-center gap-2">
                    Radamn <span class="text-indigo-400 text-[10px] font-mono px-2 py-0.5 rounded-full border border-indigo-500/30 bg-indigo-500/10">v0.dev UI</span>
                </h1>
            </div>
        </div>
        
        <button onclick="novoProjeto()" type="button" class="text-xs bg-slate-900 hover:bg-slate-800 text-slate-200 px-3 py-1.5 rounded-xl border border-slate-800 transition flex items-center space-x-1.5 shadow-sm active:scale-95">
            <i class="fa-solid fa-plus text-xs"></i> <span class="hidden sm:inline">Novo Projeto</span>
        </button>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-3 md:p-6 flex flex-col space-y-4">

        <!-- Mode Selector Tabs -->
        <div class="grid grid-cols-3 gap-1.5 bg-slate-950 p-1.5 rounded-2xl border border-slate-800/80 shadow-inner">
            <button onclick="setMode('gerar')" id="btn-gerar" type="button" class="py-2 text-xs md:text-sm font-medium rounded-xl bg-indigo-600 text-white transition flex items-center justify-center space-x-2 shadow-lg shadow-indigo-600/25">
                <i class="fa-solid fa-wand-magic-sparkles"></i> <span>Gerar UI</span>
            </button>
            <button onclick="setMode('refine')" id="btn-refine" type="button" class="py-2 text-xs md:text-sm font-medium rounded-xl text-slate-400 hover:text-white transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-sliders"></i> <span>Refinar</span>
            </button>
            <button onclick="setMode('chat')" id="btn-chat" type="button" class="py-2 text-xs md:text-sm font-medium rounded-xl text-slate-400 hover:text-white transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-comments"></i> <span>Assistente</span>
            </button>
        </div>

        <!-- Sugestões Rápidas (Chips) -->
        <div class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar text-xs">
            <span class="text-slate-500 font-medium whitespace-nowrap flex items-center gap-1">
                <i class="fa-solid fa-bolt text-amber-400"></i> Atalhos:
            </span>
            <button onclick="usarSugestao('Criar uma Landing Page moderna para um SaaS de IA em modo escuro')" type="button" class="bg-slate-950 hover:bg-slate-900 text-slate-300 border border-slate-800 px-3 py-1.5 rounded-full whitespace-nowrap transition">
                🚀 Landing Page SaaS
            </button>
            <button onclick="usarSugestao('Formulário de Login responsivo com botões sociais e modo dark')" type="button" class="bg-slate-950 hover:bg-slate-900 text-slate-300 border border-slate-800 px-3 py-1.5 rounded-full whitespace-nowrap transition">
                🔑 Tela de Login
            </button>
            <button onclick="usarSugestao('Dashboard financeiro responsivo com gráficos e cartões de métricas')" type="button" class="bg-slate-950 hover:bg-slate-900 text-slate-300 border border-slate-800 px-3 py-1.5 rounded-full whitespace-nowrap transition">
                📊 Dashboard
            </button>
        </div>

        <!-- Input Box Centralizada -->
        <div class="bg-slate-950 border border-slate-800/90 rounded-2xl p-3.5 md:p-4 flex flex-col space-y-3 shadow-xl focus-within:border-indigo-500/50 transition">
            <textarea id="prompt-input" rows="3" placeholder="Descreva a interface ou componente que deseja gerar..." class="w-full bg-black border border-slate-800/80 rounded-xl p-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition resize-none text-xs md:text-sm leading-relaxed"></textarea>
            
            <div class="flex items-center justify-between pt-1">
                <span id="current-mode-label" class="text-[11px] text-indigo-400 font-medium bg-indigo-500/10 border border-indigo-500/20 px-2.5 py-1 rounded-lg">Modo: Gerar</span>
                <button onclick="enviarPrompt()" id="submit-btn" type="button" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-xl text-xs md:text-sm font-medium transition flex items-center space-x-2 shadow-lg shadow-indigo-600/20 active:scale-95">
                    <span>Gerar Código</span> <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </div>
        </div>

        <!-- Histórico Local -->
        <div class="bg-slate-950/60 border border-slate-800/60 rounded-2xl p-3">
            <div class="flex items-center justify-between mb-2 px-1">
                <h3 class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-clock-rotate-left text-slate-500"></i> Histórico Recente
                </h3>
                <button onclick="limparHistorico()" type="button" class="text-[11px] text-rose-400 hover:text-rose-300 transition">Limpar</button>
            </div>
            <div id="history-list" class="flex gap-2 overflow-x-auto pb-1 text-xs no-scrollbar">
                <span class="text-slate-500 italic text-xs">Nenhuma geração salva ainda.</span>
            </div>
        </div>

        <!-- Output / Preview Section -->
        <div class="bg-slate-950 border border-slate-800 rounded-2xl flex flex-col overflow-hidden shadow-2xl flex-1 min-h-[420px]">
            <!-- Toolbar -->
            <div class="flex flex-wrap items-center justify-between gap-2 px-4 py-2.5 bg-black/80 border-b border-slate-800 text-xs">
                <div class="flex space-x-1 bg-slate-900/80 p-1 rounded-xl border border-slate-800">
                    <button onclick="switchTab('preview')" id="tab-preview" type="button" class="px-3 py-1 rounded-lg bg-slate-800 text-white font-medium transition">Preview</button>
                    <button onclick="switchTab('code')" id="tab-code" type="button" class="px-3 py-1 rounded-lg text-slate-400 hover:text-white transition">Código</button>
                </div>
                <div class="flex items-center space-x-1.5">
                    <button onclick="copiarCodigo()" type="button" class="bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl transition flex items-center space-x-1.5 border border-slate-800">
                        <i class="fa-regular fa-copy"></i> <span>Copiar</span>
                    </button>
                    <button onclick="baixarHtml()" type="button" class="bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl transition flex items-center space-x-1.5 border border-slate-800">
                        <i class="fa-solid fa-download"></i> <span>Baixar</span>
                    </button>
                    <button onclick="expandirPreview()" type="button" class="bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 px-3 py-1.5 rounded-xl transition flex items-center space-x-1.5 border border-indigo-500/30">
                        <i class="fa-solid fa-expand"></i> <span>Expandir</span>
                    </button>
                </div>
            </div>

            <!-- Content Area -->
            <div class="relative flex-1 bg-black flex flex-col">
                <div id="view-preview" class="absolute inset-0 w-full h-full flex flex-col">
                    <iframe id="preview-frame" class="w-full h-full border-0 bg-white"></iframe>
                </div>
                <div id="view-code" class="absolute inset-0 w-full h-full p-4 overflow-auto hidden bg-black">
                    <pre><code id="code-output" class="text-xs font-mono text-indigo-300 leading-relaxed">Aguardando geração de código...</code></pre>
                </div>
            </div>
        </div>

    </main>

    <!-- JavaScript Preservado e Integrado -->
    <script>
        let currentMode = 'gerar';
        let latestCode = '';
        let historyData = JSON.parse(localStorage.getItem('radamn_history') || '[]');

        function toggleDrawer() {
            const drawer = document.getElementById('drawer');
            const overlay = document.getElementById('drawer-overlay');
            drawer.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function usarSugestao(texto) {
            const promptInput = document.getElementById('prompt-input');
            promptInput.value = texto;
            promptInput.focus();
        }

        function setMode(mode) {
            currentMode = mode;
            ['gerar', 'refine', 'chat'].forEach(m => {
                const btn = document.getElementById(`btn-${m}`);
                if (m === mode) {
                    btn.className = "py-2 text-xs md:text-sm font-medium rounded-xl bg-indigo-600 text-white transition flex items-center justify-center space-x-2 shadow-lg shadow-indigo-600/25";
                } else {
                    btn.className = "py-2 text-xs md:text-sm font-medium rounded-xl text-slate-400 hover:text-white transition flex items-center justify-center space-x-2";
                }
            });
            document.getElementById('current-mode-label').innerText = `Modo: ${mode.charAt(0).toUpperCase() + mode.slice(1)}`;
        }

        function switchTab(tab) {
            if (tab === 'preview') {
                document.getElementById('tab-preview').className = "px-3 py-1 rounded-lg bg-slate-800 text-white font-medium transition";
                document.getElementById('tab-code').className = "px-3 py-1 rounded-lg text-slate-400 hover:text-white transition";
                document.getElementById('view-preview').classList.remove('hidden');
                document.getElementById('view-code').classList.add('hidden');
            } else {
                document.getElementById('tab-code').className = "px-3 py-1 rounded-lg bg-slate-800 text-white font-medium transition";
                document.getElementById('tab-preview').className = "px-3 py-1 rounded-lg text-slate-400 hover:text-white transition";
                document.getElementById('view-code').classList.remove('hidden');
                document.getElementById('view-preview').classList.add('hidden');
            }
        }

        async function enviarPrompt() {
            const promptInput = document.getElementById('prompt-input');
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>A gerar...</span>`;

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-radamn-key': 'JoJoStarOx'
                    },
                    body: JSON.stringify({
                        prompt: prompt,
                        mode: currentMode,
                        currentCode: latestCode
                    })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }
                
                latestCode = data.code || '<div>Sem código gerado.</div>';
                
                const frame = document.getElementById('preview-frame');
                const frameDoc = frame.contentDocument || frame.contentWindow.document;
                frameDoc.open();
                frameDoc.write(latestCode);
                frameDoc.close();

                document.getElementById('code-output').innerText = latestCode;

                const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                historyData.unshift({ prompt, code: latestCode, time: timestamp });
                if (historyData.length > 15) historyData.pop();
                localStorage.setItem('radamn_history', JSON.stringify(historyData));
                renderHistory();

                promptInput.value = '';
                switchTab('preview');

            } catch (err) {
                alert('Erro na requisição: ' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Gerar Código</span> <i class="fa-solid fa-paper-plane text-xs"></i>`;
            }
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            if (historyData.length === 0) {
                list.innerHTML = `<span class="text-slate-500 italic text-xs">Nenhuma geração salva ainda.</span>`;
                return;
            }
            list.innerHTML = historyData.map((item, index) => {
                const timeStr = item.time ? `<span class="text-indigo-400 font-mono">${item.time}</span> - ` : '';
                return `
                    <button onclick="carregarHistorico(${index})" type="button" class="flex-shrink-0 bg-slate-900/80 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl border border-slate-800 transition text-left max-w-[200px] truncate">
                        ${timeStr}${item.prompt}
                    </button>
                `;
            }).join('');
        }

        function carregarHistorico(index) {
            const item = historyData[index];
            if (!item) return;
            latestCode = item.code;
            
            const frame = document.getElementById('preview-frame');
            const frameDoc = frame.contentDocument || frame.contentWindow.document;
            frameDoc.open();
            frameDoc.write(latestCode);
            frameDoc.close();

            document.getElementById('code-output').innerText = latestCode;
            switchTab('preview');
        }

        function limparHistorico() {
            historyData = [];
            localStorage.removeItem('radamn_history');
            renderHistory();
        }

        function novoProjeto() {
            latestCode = '';
            document.getElementById('prompt-input').value = '';
            document.getElementById('code-output').innerText = 'Aguardando geração de código...';
            const frame = document.getElementById('preview-frame');
            const frameDoc = frame.contentDocument || frame.contentWindow.document;
            frameDoc.open();
            frameDoc.write('<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#64748b;background:#000000;">Novo projeto pronto. Digite um prompt!</div>');
            frameDoc.close();
        }

        function copiarCodigo() {
            if(!latestCode) return;
            navigator.clipboard.writeText(latestCode);
            alert('Código copiado!');
        }

        function baixarHtml() {
            if(!latestCode) return;
            const blob = new Blob([latestCode], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'radamn-project.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        function expandirPreview() {
            if(!latestCode) return;
            const newWindow = window.open();
            newWindow.document.write(latestCode);
            newWindow.document.close();
        }

        renderHistory();
    </script>
</body>
</html>
