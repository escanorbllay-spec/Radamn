<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Radam Nox - AI Interface</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #090d16;
      --sidebar-bg: #111623;
      --card-bg: rgba(20, 27, 41, 0.75);
      --card-hover: rgba(30, 41, 62, 0.9);
      --text-color: #f0f6fc;
      --text-muted: #8b949e;
      --accent-gradient: linear-gradient(135deg, #7c3aed 0%, #3b82f6 50%, #06b6d4 100%);
      --accent-purple: #8b5cf6;
      --user-msg: #2563eb;
      --bot-msg: #131927;
      --border-color: rgba(255, 255, 255, 0.08);
      --sidebar-width: 280px;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow: hidden;
    }

    body {
      display: flex;
      width: 100vw;
    }

    /* Sidebar Flutuante */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100dvh;
      width: var(--sidebar-width);
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 1000;
    }

    .sidebar.active { transform: translateX(0); }

    .sidebar-header {
      padding: 1.2rem 1rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.2rem;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .new-chat-btn {
      width: 100%;
      padding: 0.8rem;
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 12px;
      color: #a78bfa;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      cursor: pointer;
    }

    /* Layout Principal */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      position: relative;
    }

    header {
      padding: 0.8rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
      z-index: 10;
    }

    .menu-toggle {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.5rem;
    }

    .model-select {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      outline: none;
    }

    /* Chat Container */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .welcome-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto 0;
      text-align: center;
      padding: 1rem 0.5rem;
    }

    .welcome-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: white;
      margin-bottom: 1rem;
    }

    .welcome-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 0.4rem;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome-subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .suggestions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.8rem;
      width: 100%;
      max-width: 500px;
    }

    @media (max-width: 480px) {
      .suggestions-grid { grid-template-columns: 1fr; }
    }

    .suggestion-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 0.9rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .card-icon { font-size: 1.2rem; color: #a78bfa; }
    .card-text { font-size: 0.85rem; color: var(--text-color); font-weight: 500; }

    /* Mensagens */
    .message-wrapper {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      max-width: 88%;
    }

    .user-wrapper { align-self: flex-end; }
    .bot-wrapper { align-self: flex-start; }

    .message {
      padding: 0.9rem 1.1rem;
      border-radius: 16px;
      line-height: 1.5;
      word-break: break-word;
      font-size: 0.95rem;
    }

    .user-message {
      background-color: var(--user-msg);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .bot-message {
      background-color: var(--bot-msg);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
    }

    /* Barra de Digitação e Formulário */
    #input-container {
      padding: 0.8rem 1rem 1.2rem 1rem;
      background: var(--bg-color);
      flex-shrink: 0;
      width: 100%;
    }

    .attachment-preview {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.4rem;
    }

    .preview-item {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .preview-item img { width: 100%; height: 100%; object-fit: cover; }

    .chat-form {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background-color: var(--sidebar-bg);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 0.4rem 0.8rem;
    }

    .chat-form:focus-within {
      border-color: var(--accent-purple);
    }

    textarea {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-color);
      outline: none;
      resize: none;
      max-height: 100px;
      font-size: 0.95rem;
      padding: 0.4rem 0;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:active { color: #a78bfa; }

    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <!-- Menu Lateral -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="brand-title">Radam Nox</span>
      <button type="button" class="menu-toggle" id="btn-close-sidebar"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div style="padding: 0.8rem;">
      <button type="button" class="new-chat-btn" id="btn-new-chat"><i class="fa-solid fa-plus"></i> Novo Chat</button>
    </div>
  </aside>

  <div class="main-container">
    <header>
      <div style="display: flex; align-items: center; gap: 0.8rem;">
        <button type="button" class="menu-toggle" id="btn-open-sidebar"><i class="fa-solid fa-bars"></i></button>
        <span class="brand-title">Radam Nox</span>
      </div>
      <select class="model-select" id="model-select">
        <option value="radam-nox-fast">Nox Fast</option>
        <option value="radam-nox-thinker">Nox Thinker</option>
      </select>
    </header>

    <!-- Chat Container -->
    <div id="chat-container">
      <div class="welcome-hero" id="welcome-hero">
        <div class="welcome-icon"><i class="fa-solid fa-bolt"></i></div>
        <h1 class="welcome-title">Olá, Blay</h1>
        <p class="welcome-subtitle">Como posso te ajudar no Radam Nox hoje?</p>
        
        <div class="suggestions-grid">
          <div class="suggestion-card" data-prompt="Escreva um script de automação em Python">
            <i class="fa-solid fa-code card-icon"></i>
            <span class="card-text">Criar script em Python</span>
          </div>
          <div class="suggestion-card" data-prompt="Analise uma arquitetura de microsserviços para o meu backend">
            <i class="fa-solid fa-network-wired card-icon"></i>
            <span class="card-text">Arquitetura de Software</span>
          </div>
          <div class="suggestion-card" data-prompt="Pesquise e resuma as principais novidades de IA">
            <i class="fa-solid fa-globe card-icon"></i>
            <span class="card-text">Pesquisa Web em Tempo Real</span>
          </div>
          <div class="suggestion-card" data-prompt="Ajude a revisar e otimizar meu código no GitHub">
            <i class="fa-solid fa-bug card-icon"></i>
            <span class="card-text">Revisar e Refatorar Código</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Barra de Entrada e Formulário de Envio -->
    <div id="input-container">
      <div class="attachment-preview" id="attachment-preview"></div>
      
      <form class="chat-form" id="chat-form">
        <button type="button" class="icon-btn" id="btn-attach" title="Anexar arquivo">
          <i class="fa-solid fa-paperclip"></i>
        </button>
        <button type="button" class="icon-btn" id="btn-camera" title="Tirar foto">
          <i class="fa-solid fa-camera"></i>
        </button>
        
        <textarea id="user-input" rows="1" placeholder="Pergunte qualquer coisa ao Radam Nox..."></textarea>

        <button type="button" class="icon-btn" id="btn-mic" title="Voz">
          <i class="fa-solid fa-microphone"></i>
        </button>

        <button type="submit" class="icon-btn" id="btn-send" style="color: #a78bfa;">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
      </form>
    </div>
  </div>

  <input type="file" id="file-input" multiple>
  <input type="file" id="camera-input" accept="image/*" capture="environment">

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const API_URL = "https://radamanthys-core.onrender.com/api/chat";
      let selectedFiles = [];

      const sidebar = document.getElementById("sidebar");
      const btnOpenSidebar = document.getElementById("btn-open-sidebar");
      const btnCloseSidebar = document.getElementById("btn-close-sidebar");
      const btnNewChat = document.getElementById("btn-new-chat");
      
      const chatContainer = document.getElementById("chat-container");
      const chatForm = document.getElementById("chat-form");
      const userInput = document.getElementById("user-input");
      const attachmentPreview = document.getElementById("attachment-preview");

      const fileInput = document.getElementById("file-input");
      const cameraInput = document.getElementById("camera-input");
      const btnAttach = document.getElementById("btn-attach");
      const btnCamera = document.getElementById("btn-camera");
      const btnMic = document.getElementById("btn-mic");

      // Abrir/Fechar Sidebar
      btnOpenSidebar.addEventListener("click", () => sidebar.classList.add("active"));
      btnCloseSidebar.addEventListener("click", () => sidebar.classList.remove("active"));

      // Novo Chat
      btnNewChat.addEventListener("click", () => {
        chatContainer.innerHTML = `
          <div class="welcome-hero" id="welcome-hero">
            <div class="welcome-icon"><i class="fa-solid fa-bolt"></i></div>
            <h1 class="welcome-title">Olá, Blay</h1>
            <p class="welcome-subtitle">Como posso te ajudar no Radam Nox hoje?</p>
            <div class="suggestions-grid">
              <div class="suggestion-card" data-prompt="Escreva um script de automação em Python">
                <i class="fa-solid fa-code card-icon"></i>
                <span class="card-text">Criar script em Python</span>
              </div>
              <div class="suggestion-card" data-prompt="Analise uma arquitetura de microsserviços para o meu backend">
                <i class="fa-solid fa-network-wired card-icon"></i>
                <span class="card-text">Arquitetura de Software</span>
              </div>
              <div class="suggestion-card" data-prompt="Pesquise e resuma as principais novidades de IA">
                <i class="fa-solid fa-globe card-icon"></i>
                <span class="card-text">Pesquisa Web em Tempo Real</span>
              </div>
              <div class="suggestion-card" data-prompt="Ajude a revisar e otimizar meu código no GitHub">
                <i class="fa-solid fa-bug card-icon"></i>
                <span class="card-text">Revisar e Refatorar Código</span>
              </div>
            </div>
          </div>`;
        bindCardClicks();
        sidebar.classList.remove("active");
      });

      // Clique nos Cards de Sugestão
      function bindCardClicks() {
        document.querySelectorAll(".suggestion-card").forEach(card => {
          card.addEventListener("click", () => {
            const prompt = card.getAttribute("data-prompt");
            userInput.value = prompt;
            handleSendMessage();
          });
        });
      }
      bindCardClicks();

      // Ajuste automático do tamanho do campo de texto
      userInput.addEventListener("input", () => {
        userInput.style.height = "auto";
        userInput.style.height = userInput.scrollHeight + "px";
      });

      // Envio de formulário (Botão ou Enter)
      userInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          handleSendMessage();
        }
      });

      chatForm.addEventListener("submit", (e) => {
        e.preventDefault();
        handleSendMessage();
      });

      // Anexo e Câmera
      btnAttach.addEventListener("click", () => fileInput.click());
      btnCamera.addEventListener("click", () => cameraInput.click());

      fileInput.addEventListener("change", handleFileSelect);
      cameraInput.addEventListener("change", handleFileSelect);

      function handleFileSelect(e) {
        const files = Array.from(e.target.files);
        files.forEach(file => {
          selectedFiles.push(file);
          const reader = new FileReader();
          reader.onload = (event) => {
            const div = document.createElement("div");
            div.className = "preview-item";
            div.innerHTML = `<img src="${event.target.result}" alt="preview">`;
            attachmentPreview.appendChild(div);
          };
          reader.readAsDataURL(file);
        });
      }

      // Microfone
      btnMic.addEventListener("click", () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("O navegador não suporta a entrada por voz.");
          return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'pt-BR';
        recognition.start();

        btnMic.style.color = "#ef4444";
        recognition.onresult = (e) => {
          userInput.value += e.results[0][0].transcript;
          btnMic.style.color = "var(--text-muted)";
        };
        recognition.onerror = () => btnMic.style.color = "var(--text-muted)";
        recognition.onend = () => btnMic.style.color = "var(--text-muted)";
      });

      // Função Principal de Envio de Mensagem
      async function handleSendMessage() {
        const text = userInput.value.trim();
        if (!text && selectedFiles.length === 0) return;

        const welcomeHero = document.getElementById("welcome-hero");
        if (welcomeHero) welcomeHero.remove();

        // Adiciona Mensagem do Usuário
        appendMessage(text, "user", selectedFiles);

        // Limpa Inputs
        userInput.value = "";
        userInput.style.height = "auto";
        attachmentPreview.innerHTML = "";
        selectedFiles = [];

        // Adiciona indicador de carregamento
        const loadingDiv = document.createElement("div");
        loadingDiv.className = "message-wrapper bot-wrapper";
        loadingDiv.innerHTML = `<div class="message bot-message">Radam Nox está pensando...</div>`;
        chatContainer.appendChild(loadingDiv);
        scrollToBottom();

        try {
          const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
          });

          const data = await res.json();
          loadingDiv.remove();

          const botReply = data.reply || data.response || data.message || "Resposta recebida com sucesso!";
          appendMessage(botReply, "bot");

        } catch (err) {
          loadingDiv.remove();
          appendMessage("⚠️ Não foi possível conectar ao servidor. Verifique se a API backend está ativa.", "bot");
        }
      }

      function appendMessage(content, sender, files = []) {
        const wrapper = document.createElement("div");
        wrapper.className = `message-wrapper ${sender}-wrapper`;

        let imgsHtml = "";
        if (files.length > 0) {
          files.forEach(f => {
            imgsHtml += `<br><img src="${URL.createObjectURL(f)}" style="max-width:180px; border-radius:10px; margin-top:5px;">`;
          });
        }

        wrapper.innerHTML = `<div class="message ${sender}-message">${content} ${imgsHtml}</div>`;
        chatContainer.appendChild(wrapper);
        scrollToBottom();
      }

      function scrollToBottom() {
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    });
  </script>
</body>
</html>
