<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Radamn AI - Direct Render v2.5.0</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0d1117;
      --sidebar-bg: #161b22;
      --card-bg: #1c2128;
      --text-color: #c9d1d9;
      --text-muted: #8b949e;
      --accent-color: #58a6ff;
      --accent-hover: #1f6feb;
      --user-msg: #238636;
      --bot-msg: #161b22;
      --border-color: #30363d;
      --sidebar-width: 280px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* 18. Sidebar & Navigation */
    .sidebar {
      width: var(--sidebar-width);
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
      z-index: 100;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        height: 100%;
        transform: translateX(-100%);
      }
      .sidebar.active { transform: translateX(0); }
    }

    .sidebar-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .new-chat-btn {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--accent-color);
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    .chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .history-item {
      padding: 0.75rem;
      border-radius: 6px;
      margin-bottom: 0.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .history-item:hover { background-color: var(--card-bg); }

    /* Main Area */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    header {
      background-color: var(--sidebar-bg);
      padding: 0.8rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
    }

    .menu-toggle {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 1.2rem;
      cursor: pointer;
    }

    /* 20. Model Picker */
    .model-select {
      background: var(--card-bg);
      color: var(--accent-color);
      border: 1px solid var(--border-color);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .message-wrapper {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-width: 85%;
    }

    .user-wrapper { align-self: flex-end; }
    .bot-wrapper { align-self: flex-start; }

    .message {
      padding: 1rem;
      border-radius: 12px;
      line-height: 1.5;
      word-break: break-word;
      font-size: 0.95rem;
    }

    .user-message {
      background-color: var(--user-msg);
      color: white;
      border-bottom-right-radius: 2px;
    }

    .bot-message {
      background-color: var(--bot-msg);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 2px;
    }

    /* 6. Thinking Process Accordion */
    .thinking-accordion {
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 0.5rem;
      overflow: hidden;
      font-size: 0.85rem;
    }

    .thinking-header {
      padding: 0.5rem 0.8rem;
      background-color: rgba(255, 255, 255, 0.05);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
    }

    .thinking-content {
      padding: 0.8rem;
      display: none;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      white-space: pre-wrap;
    }

    .thinking-accordion.open .thinking-content { display: block; }

    /* 5. Bouncing Dots Loading Indicator */
    .bouncing-dots {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 0.5rem 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-color);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1.0); }
    }

    /* 8, 9, 10, 11, 13. Actions Toolbar */
    .actions-toolbar {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.4rem;
      flex-wrap: wrap;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.3rem 0.5rem;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .action-btn:hover {
      background-color: var(--card-bg);
      color: var(--text-color);
    }

    /* Input Container & 2. Attachment / Camera Options */
    #input-container {
      padding: 1rem;
      background-color: var(--sidebar-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .attachment-preview {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }

    .preview-item {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .preview-item img { width: 100%; height: 100%; object-fit: cover; }

    .input-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.4rem 0.8rem;
    }

    textarea {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-color);
      outline: none;
      resize: none;
      max-height: 120px;
      font-size: 0.95rem;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0.4rem;
      border-radius: 50%;
    }

    .icon-btn:hover { color: var(--accent-color); }

    /* Hidden Inputs for Hardware Access */
    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <!-- 18. Sidebar & History -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span style="font-weight: bold; color: var(--accent-color);">Radamn AI</span>
      <button class="menu-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div style="padding: 0.5rem;">
      <button class="new-chat-btn" onclick="startNewChat()"><i class="fa-solid fa-plus"></i> Novo Chat</button>
    </div>
    <div class="chat-history" id="chat-history">
      <div class="history-item"><span>Conversa de Exemplo</span><i class="fa-solid fa-trash" style="font-size: 0.75rem;"></i></div>
    </div>
  </aside>

  <div class="main-container">
    <header>
      <div style="display: flex; align-items: center; gap: 0.8rem;">
        <button class="menu-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
        <span style="font-weight: bold;">Radamn Core v2.5</span>
      </div>
      <!-- 20. Selection of Models -->
      <select class="model-select" id="model-select">
        <option value="radamn-fast">Radamn Fast (Rápido)</option>
        <option value="radamn-thinker">Radamn Thinker (Raciocínio)</option>
        <option value="radamn-multimodal">Radamn Multimodal</option>
      </select>
    </header>

    <div id="chat-container">
      <div class="message-wrapper bot-wrapper">
        <div class="message bot-message">
          Olá! Eu sou a <b>Radamn AI</b>. Conexão direta ao motor pronta! Como posso te ajudar hoje?
        </div>
      </div>
    </div>

    <!-- 1. Input Bar & Attachments -->
    <div id="input-container">
      <div class="attachment-preview" id="attachment-preview"></div>
      <div class="input-box">
        <!-- 2. Attachment / Plus Icon -->
        <button class="icon-btn" onclick="document.getElementById('file-input').click()" title="Anexar arquivo/imagem">
          <i class="fa-solid fa-paperclip"></i>
        </button>
        <!-- Mobile Native Camera Capture -->
        <button class="icon-btn" onclick="document.getElementById('camera-input').click()" title="Tirar foto">
          <i class="fa-solid fa-camera"></i>
        </button>
        
        <!-- 1. Text Area Multiline -->
        <textarea id="user-input" rows="1" placeholder="Digite uma mensagem..." oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>

        <!-- 3. Microphone Icon -->
        <button class="icon-btn" id="mic-btn" onclick="toggleVoiceInput()" title="Entrada por voz">
          <i class="fa-solid fa-microphone"></i>
        </button>

        <button class="icon-btn" style="color: var(--accent-color);" onclick="sendMessage()" id="send-btn">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Hidden Native File & Camera Inputs -->
  <input type="file" id="file-input" multiple onchange="handleFileSelect(event)">
  <input type="file" id="camera-input" accept="image/*" capture="environment" onchange="handleFileSelect(event)">

  <script>
    const API_URL = "https://radamanthys-core.onrender.com/api/chat";
    let selectedFiles = [];
    let isRecording = false;

    // 18. Sidebar Toggle
    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("active");
    }

    function startNewChat() {
      document.getElementById("chat-container").innerHTML = `
        <div class="message-wrapper bot-wrapper">
          <div class="message bot-message">Novo chat iniciado. Como posso ajudar?</div>
        </div>`;
    }

    // Auto-resize Textarea
    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    }

    // 1. Keydown handling (Enter to send, Shift+Enter for newline)
    function handleKeyDown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    // 2. Handle Attachment & Native Mobile Camera Input
    function handleFileSelect(event) {
      const files = Array.from(event.target.files);
      files.forEach(file => {
        selectedFiles.push(file);
        const reader = new FileReader();
        reader.onload = (e) => {
          const previewContainer = document.getElementById("attachment-preview");
          const div = document.createElement("div");
          div.className = "preview-item";
          div.innerHTML = `<img src="${e.target.result}" alt="preview">`;
          previewContainer.appendChild(div);
        };
        reader.readAsDataURL(file);
      });
    }

    // 3. Voice Input Transcription
    function toggleVoiceInput() {
      const micBtn = document.getElementById("mic-btn");
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert("Reconhecimento de voz não suportado neste navegador.");
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';

      if (!isRecording) {
        recognition.start();
        isRecording = true;
        micBtn.style.color = "red";
      }

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById("user-input").value += transcript;
        micBtn.style.color = "var(--text-muted)";
        isRecording = false;
      };

      recognition.onerror = () => {
        micBtn.style.color = "var(--text-muted)";
        isRecording = false;
      };
    }

    // Send Message Core Logic
    async function sendMessage() {
      const inputField = document.getElementById("user-input");
      const messageText = inputField.value.trim();

      if (!messageText && selectedFiles.length === 0) return;

      appendUserMessage(messageText, selectedFiles);

      inputField.value = "";
      inputField.style.height = "auto";
      document.getElementById("attachment-preview").innerHTML = "";
      selectedFiles = [];

      // 5. Bouncing Dots & 6. Thinking Process State
      const botWrapper = createBotLoadingMessage();

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: messageText })
        });

        const data = await response.json();
        botWrapper.remove();

        let replyText = data.reply || data.response || data.message || (typeof data === "string" ? data : JSON.stringify(data));
        
        // 7. Streaming Response simulation & Render Actions
        appendBotResponse(replyText, "Procurando informações na web...\nAnalisando lógica de resposta...");

      } catch (error) {
        botWrapper.remove();
        appendBotResponse("⚠️ Erro ao conectar ao motor no Render. Tente novamente em instantes.");
      }
    }

    function appendUserMessage(text, files) {
      const container = document.getElementById("chat-container");
      const wrapper = document.createElement("div");
      wrapper.className = "message-wrapper user-wrapper";

      let imgsHtml = "";
      files.forEach(file => {
        imgsHtml += `<br><img src="${URL.createObjectURL(file)}" style="max-width:200px; border-radius:8px; margin-top:5px;">`;
      });

      wrapper.innerHTML = `<div class="message user-message">${text} ${imgsHtml}</div>`;
      container.appendChild(wrapper);
      container.scrollTop = container.scrollHeight;
    }

    // 5. Create Bouncing Dots Loading Component
    function createBotLoadingMessage() {
      const container = document.getElementById("chat-container");
      const wrapper = document.createElement("div");
      wrapper.className = "message-wrapper bot-wrapper";
      
      wrapper.innerHTML = `
        <div class="message bot-message">
          <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:4px;">Pensando...</div>
          <div class="bouncing-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </div>`;
      
      container.appendChild(wrapper);
      container.scrollTop = container.scrollHeight;
      return wrapper;
    }

    // 6, 7, 8, 9, 10, 11, 13. Append Bot Response with Toolbar & Thinking Accordion
    function appendBotResponse(text, thinkingSteps = "") {
      const container = document.getElementById("chat-container");
      const wrapper = document.createElement("div");
      wrapper.className = "message-wrapper bot-wrapper";

      let thinkingHtml = "";
      if (thinkingSteps) {
        thinkingHtml = `
          <div class="thinking-accordion">
            <div class="thinking-header" onclick="this.parentElement.classList.toggle('open')">
              <span><i class="fa-solid fa-brain"></i> Processo de Raciocínio</span>
              <i class="fa-solid fa-chevron-down"></i>
            </div>
            <div class="thinking-content">${thinkingSteps}</div>
          </div>`;
      }

      wrapper.innerHTML = `
        ${thinkingHtml}
        <div class="message bot-message">${text}</div>
        <!-- Action Toolbar -->
        <div class="actions-toolbar">
          <button class="action-btn" onclick="copyText('${encodeURIComponent(text)}')" title="Copiar"><i class="fa-regular fa-copy"></i></button>
          <button class="action-btn" onclick="alert('Obrigado pelo feedback!')" title="Gostar"><i class="fa-regular fa-thumbs-up"></i></button>
          <button class="action-btn" onclick="alert('Feedback registrado!')" title="Não gostar"><i class="fa-regular fa-thumbs-down"></i></button>
          <button class="action-btn" onclick="window.open('https://google.com/search?q=' + encodeURIComponent('${text.substring(0, 30)}'))" title="Google Search"><i class="fa-brands fa-google"></i> Search</button>
        </div>`;

      container.appendChild(wrapper);
      container.scrollTop = container.scrollHeight;
    }

    // 8. Copy Function
    function copyText(encodedText) {
      navigator.clipboard.writeText(decodeURIComponent(encodedText));
      alert("Texto copiado para a área de transferência!");
    }
  </script>
</body>
</html>
