<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radamn AI — Assistente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
    </style>
</head>
<body class="bg-black text-slate-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- Header -->
    <header class="flex items-center justify-between px-4 py-3 border-b border-slate-800/80 bg-slate-950/80 sticky top-0 z-30">
        <div class="flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <h1 class="font-bold text-sm tracking-wide text-white">Radamn <span class="text-indigo-400 text-[10px] font-mono px-2 py-0.5 rounded-full border border-indigo-500/30 bg-indigo-500/10">Assistente</span></h1>
        </div>
    </header>

    <!-- Main Chat Area -->
    <main class="flex-1 max-w-3xl w-full mx-auto p-4 flex flex-col justify-between space-y-4">

        <!-- Feed de Conversa -->
        <div id="chat-box" class="flex-1 bg-slate-950 border border-slate-800 rounded-2xl p-4 overflow-y-auto min-h-[350px] space-y-3">
            <div class="bg-indigo-950/40 border border-indigo-800/40 p-3 rounded-xl text-xs text-indigo-200">
                💬 <b>Radamn AI:</b> Olá! O chat do assistente está ativo e pronto para responder.
            </div>
        </div>

        <!-- Input Box -->
        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3 flex flex-col space-y-2">
            <textarea id="prompt-input" rows="2" placeholder="Escreva a sua mensagem para a Radamn AI..." class="w-full bg-black border border-slate-800 rounded-xl p-3 text-slate-100 text-xs focus:outline-none focus:border-indigo-500 transition resize-none"></textarea>
            
            <div class="flex justify-end">
                <button onclick="enviarMensagem()" id="submit-btn" type="button" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-xl text-xs font-medium transition shadow-lg shadow-indigo-600/20 active:scale-95">
                    Enviar ➔
                </button>
            </div>
        </div>

    </main>

    <script>
        async function enviarMensagem() {
            const input = document.getElementById('prompt-input');
            const chatBox = document.getElementById('chat-box');
            const btn = document.getElementById('submit-btn');
            const texto = input.value.trim();

            if (!texto) return;

            // Adiciona mensagem do usuário no chat
            chatBox.innerHTML += `
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl text-xs text-slate-200 ml-6">
                    <b>Você:</b> ${texto}
                </div>
            `;

            input.value = '';
            btn.disabled = true;
            btn.innerText = 'Enviando...';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: texto, mode: 'chat' })
                });

                const data = await response.json();
                const resposta = data.response || data.error || 'Sem resposta.';

                // Adiciona resposta do assistente no chat
                chatBox.innerHTML += `
                    <div class="bg-indigo-950/40 border border-indigo-800/40 p-3 rounded-xl text-xs text-indigo-200 mr-6 whitespace-pre-wrap">
                        🤖 <b>Radamn AI:</b>\n${resposta}
                    </div>
                `;
            } catch (err) {
                chatBox.innerHTML += `
                    <div class="bg-rose-950/40 border border-rose-800/40 p-3 rounded-xl text-xs text-rose-300 mr-6">
                        ⚠️ Erro ao enviar mensagem.
                    </div>
                `;
            } finally {
                btn.disabled = false;
                btn.innerText = 'Enviar ➔';
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>
</body>
</html>
