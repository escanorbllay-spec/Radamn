<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radamn AI - Engine v2.0</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --text-color: #c9d1d9;
      --accent-color: #58a6ff;
      --user-msg: #1f6feb;
      --bot-msg: #21262d;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: var(--card-bg);
      padding: 1rem;
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
      border-bottom: 1px solid #30363d;
      color: var(--accent-color);
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .message {
      max-width: 80%;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      line-height: 1.4;
      word-break: break-word;
    }
    .user-message {
      align-self: flex-end;
      background-color: var(--user-msg);
      color: white;
    }
    .bot-message {
      align-self: flex-start;
      background-color: var(--bot-msg);
      border: 1px solid #30363d;
    }
    .media-img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 0.5rem;
    }
    #input-container {
      padding: 1rem;
      background-color: var(--card-bg);
      display: flex;
      gap: 0.5rem;
      border-top: 1px solid #30363d;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.8rem;
      border-radius: 8px;
      border: 1px solid #30363d;
      background-color: var(--bg-color);
      color: var(--text-color);
      outline: none;
    }
    button {
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
      border: none;
      background-color: var(--accent-color);
      color: black;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <header>Radamn AI - v2.0 Core Engine</header>

  <div id="chat-container">
    <div class="message bot-message">
      Olá! Eu sou a <b>Radamn AI</b>. O meu novo motor no Render já está online! Como posso te ajudar hoje?
    </div>
  </div>

  <div id="input-container">
    <input type="text" id="user-input" placeholder="Digite uma mensagem ou 'crie uma imagem de...'" onkeydown="if(event.key === 'Enter') sendMessage()">
    <button id="send-btn" onclick="sendMessage()">Enviar</button>
  </div>

  <script>
    // Chama a rota de API local da Vercel para intermediação segura
    const API_URL = "/api/generate";

    async function sendMessage() {
      const inputField = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");
      const chatContainer = document.getElementById("chat-container");
      const messageText = inputField.value.trim();

      if (!messageText) return;

      appendMessage(messageText, "user-message");
      inputField.value = "";
      sendBtn.disabled = true;

      const loadingDiv = appendMessage("Processando no motor Radamn...", "bot-message");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: messageText })
        });

        const data = await response.json();
        loadingDiv.remove();

        if (!response.ok) {
          appendMessage(`⚠️ ${data.error || 'Erro no servidor.'}`, "bot-message");
          return;
        }

        let textToShow = data.reply || data.response || data.message || (typeof data === "string" ? data : JSON.stringify(data));

        if (data.type === "image") {
          appendMessage(`${textToShow}<br><img class="media-img" src="${data.media_url}" alt="Imagem Gerada">`, "bot-message");
        } else {
          appendMessage(textToShow, "bot-message");
        }

      } catch (error) {
        if (loadingDiv) loadingDiv.remove();
        appendMessage("⚠️ Erro ao conectar ao servidor backend no Render.", "bot-message");
        console.error(error);
      } finally {
        sendBtn.disabled = false;
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    }

    function appendMessage(content, className) {
      const chatContainer = document.getElementById("chat-container");
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${className}`;
      msgDiv.innerHTML = content;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgDiv;
    }
  </script>
</body>
</html>
