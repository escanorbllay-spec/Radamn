<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Radam Nox - AI Interface</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #000000;
      --sidebar-bg: #0b0d14;
      --card-bg: #121520;
      --card-hover: #1c2130;
      --text-color: #f3f4f6;
      --text-muted: #8b949e;
      --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 50%, #06b6d4 100%);
      --accent-purple: #8b5cf6;
      --user-msg: #2563eb;
      --bot-msg: #121520;
      --border-color: rgba(255, 255, 255, 0.12);
      --sidebar-width: 280px;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow: hidden;
    }

    body { display: flex; width: 100vw; position: relative; }

    /* Overlay escuro para a Sidebar */
    .sidebar-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100dvh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 1500;
      display: none;
    }
    .sidebar-overlay.active { display: block; }

    /* Sidebar / Menu Lateral */
    .sidebar {
      position: fixed;
      top: 0; left: 0;
      height: 100%; height: 100dvh;
      width: var(--sidebar-width);
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.25s ease-in-out;
      z-index: 2000;
    }

    .sidebar.active { transform: translateX(0); }

    .sidebar-header {
      padding: 1.2rem 1rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.2rem;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .new-chat-btn {
      width: calc(100% - 1.6rem);
      margin: 0.8rem;
      padding: 0.8rem;
      background-color: var(--card-bg);
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-radius: 12px;
      color: #c4b5fd;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      cursor: pointer;
    }

    .new-chat-btn:active { background-color: var(--card-hover); }

    /* Layout Principal */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%; height: 100dvh;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    header {
      background-color: var(--bg-color);
      padding: 0.8rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .menu-toggle {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 1.3rem;
      cursor: pointer;
      padding: 0.4rem;
    }

    .model-select {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      outline: none;
    }

    /* Área do Chat */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      -webkit-overflow-scrolling: touch;
    }

    .welcome-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto 0;
      text-align: center;
      padding: 1.5rem 0.5rem;
    }

    .welcome-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: var(--accent-gradient);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; color: white;
      margin-bottom: 1rem;
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.4);
    }

    .welcome-title {
      font-size: 1.9rem; font-weight: 800; margin-bottom: 0.4rem;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome-subtitle {
      color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.8rem;
    }

    .suggestions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.8rem; width: 100%; max-width: 500px;
    }

    @media (max-width: 480px) {
      .suggestions-grid { grid-template-columns: 1fr; }
    }

    .suggestion-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 0.9rem;
      text-align: left;
      cursor: pointer;
      display: flex; align-items: center; gap: 0.8rem;
      transition: background 0.2s;
    }

    .suggestion-card:active { background: var(--card-hover); }

    .card-icon { font-size: 1.2rem; color: #a78bfa; }
    .card-text { font-size: 0.85rem; color: var(--text-color); font-weight: 500; }

    /* Mensagens */
    .message {
      max-width: 88%;
      padding: 0.9rem 1.1rem;
      border-radius: 16px;
      line-height: 1.5;
      word-break: break-word;
      font-size: 0.95rem;
    }
    .user-message { align-self: flex-end; background-color: var(--user-msg); color: white; border-bottom-right-radius: 4px; }
    .bot-message { align-self: flex-start; background-color: var(--bot-msg); border: 1px solid var(--border-color); border-bottom-left-radius: 4px; }

    /* Barra de Digitação Estilo Cápsula Moderna */
    #input-container {
      padding: 0.8rem 1rem 1.2rem 1rem;
      background-color: var(--bg-color);
      border-top: 1px solid var(--border-color);
      flex-shrink: 0;
      width: 100%;
      z-index: 100;
    }

    .input-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 0.5rem 0.9rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .input-box:focus-within {
      border-color: var(--accent-purple);
    }

    textarea {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-color);
      outline: none;
      resize: none;
      max-height: 100px;
      font-size: 0.95rem;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.15rem;
      cursor: pointer;
      padding: 0.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .icon-btn:active { color: #c4b5fd; }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Menu Lateral -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="brand-title">Radam Nox</span>
      <button class="menu-toggle" id="btn-close-sidebar"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <button class="new-chat-btn" id="btn-new-chat"><i class="fa-solid fa-plus"></i> Novo Chat</button>
  </aside>

  <div class="main-container">
    <header>
      <div style="display: flex; align-items: center; gap: 0.8rem;">
        <button class="menu-toggle" id="btn-open-sidebar"><i class="fa-solid fa-bars"></i></button>
        <span class="brand-title">Radam Nox</span>
      </div>
      <select class="model-select" id="model-select">
        <option value="radam-nox-fast">Nox Fast</option>
        <option value="radam-nox-thinker">Nox Thinker</option>
      </select>
    </header>

    <div id="chat-container">
      <div class="welcome-hero" id="welcome-hero">
        <div class="welcome-icon"><i class="fa-solid fa-bolt"></i></div>
        <h1 class="welcome-title">Olá, Blay</h1>
        <p class="welcome-subtitle">Como posso te ajudar no Radam Nox hoje?</p>
        
        <div class="suggestions-grid">
          <div class="suggestion-card" data-prompt="Escreva um script de automação em Python">
            <i class="fa-solid fa-code card-icon"></i>
            <span class="card-text">Criar script em Python</span>
          </div>
          <div class="suggestion-card" data-prompt="Analise uma arquitetura de microsserviços para o meu backend">
            <i class="fa-solid fa-network-wired card-icon"></i>
            <span class="card-text">Arquitetura de Software</span>
          </div>
          <div class="suggestion-card" data-prompt="Pesquise e resuma as principais novidades de IA">
            <i class="fa-solid fa-globe card-icon"></i>
            <span class="card-text">Pesquisa Web em Tempo Real</span>
          </div>
          <div class="suggestion-card" data-prompt="Ajude a revisar e otimizar meu código no GitHub">
            <i class="fa-solid fa-bug card-icon"></i>
            <span class="card-text">Revisar e Refatorar Código</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Barra de Entrada Cápsula Moderna -->
    <div id="input-container">
      <div class="input-box">
        <button class="icon-btn" id="btn-attach" title="Anexar arquivo"><i class="fa-solid fa-paperclip"></i></button>
        <button class="icon-btn" id="btn-camera" title="Tirar foto"><i class="fa-solid fa-camera"></i></button>
        
        <textarea id="user-input" rows="1" placeholder="Pergunte qualquer coisa ao Radam Nox..."></textarea>

        <button class="icon-btn" id="btn-mic" title="Voz"><i class="fa-solid fa-microphone"></i></button>
        <button class="icon-btn" id="send-btn" style="color: #a78bfa;" title="Enviar"><i class="fa-solid fa-arrow-up"></i></button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://radamanthys-core.onrender.com/api/chat";

    // Controlo da Sidebar
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("sidebar-overlay");
    
    document.getElementById("btn-open-sidebar").addEventListener("click", () => {
      sidebar.classList.add("active");
      overlay.classList.add("active");
    });
    
    document.getElementById("btn-close-sidebar").addEventListener("click", () => {
      sidebar.classList.remove("active");
      overlay.classList.remove("active");
    });

    overlay.addEventListener("click", () => {
      sidebar.classList.remove("active");
      overlay.classList.remove("active");
    });

    // Novo Chat
    document.getElementById("btn-new-chat").addEventListener("click", () => {
      document.getElementById("chat-container").innerHTML = `
        <div class="welcome-hero" id="welcome-hero">
          <div class="welcome-icon"><i class="fa-solid fa-bolt"></i></div>
          <h1 class="welcome-title">Olá, Blay</h1>
          <p class="welcome-subtitle">Como posso te ajudar no Radam Nox hoje?</p>
          <div class="suggestions-grid">
            <div class="suggestion-card" data-prompt="Escreva um script de automação em Python">
              <i class="fa-solid fa-code card-icon"></i>
              <span class="card-text">Criar script em Python</span>
            </div>
            <div class="suggestion-card" data-prompt="Analise uma arquitetura de microsserviços para o meu backend">
              <i class="fa-solid fa-network-wired card-icon"></i>
              <span class="card-text">Arquitetura de Software</span>
            </div>
            <div class="suggestion-card" data-prompt="Pesquise e resuma as principais novidades de IA">
              <i class="fa-solid fa-globe card-icon"></i>
              <span class="card-text">Pesquisa Web em Tempo Real</span>
            </div>
            <div class="suggestion-card" data-prompt="Ajude a revisar e otimizar meu código no GitHub">
              <i class="fa-solid fa-bug card-icon"></i>
              <span class="card-text">Revisar e Refatorar Código</span>
            </div>
          </div>
        </div>`;
      bindCards();
      sidebar.classList.remove("active");
      overlay.classList.remove("active");
    });

    // Cards de Sugestão
    function bindCards() {
      document.querySelectorAll(".suggestion-card").forEach(card => {
        card.addEventListener("click", () => {
          document.getElementById("user-input").value = card.getAttribute("data-prompt");
          sendMessage();
        });
      });
    }
    bindCards();

    // Auto-resize textarea
    const userInput = document.getElementById("user-input");
    userInput.addEventListener("input", function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });

    // Envio por Enter
    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Envio pelo botão de seta
    document.getElementById("send-btn").addEventListener("click", sendMessage);

    // Botões auxiliares
    document.getElementById("btn-attach").addEventListener("click", () => alert("Anexar ficheiros ativo."));
    document.getElementById("btn-camera").addEventListener("click", () => alert("Câmara ativa."));
    document.getElementById("btn-mic").addEventListener("click", () => alert("Microfone ativo."));

    // Função de Envio Principal
    async function sendMessage() {
      const messageText = userInput.value.trim();
      const chatContainer = document.getElementById("chat-container");
      
      if (!messageText) return;

      const welcomeHero = document.getElementById("welcome-hero");
      if (welcomeHero) welcomeHero.remove();

      appendMessage(messageText, "user-message");
      userInput.value = "";
      userInput.style.height = "auto";

      const loadingDiv = appendMessage("Radam Nox a pensar...", "bot-message");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: messageText })
        });

        const data = await response.json();
        loadingDiv.remove();

        let textToShow = data.reply || data.response || data.message || (typeof data === "string" ? data : JSON.stringify(data));
        appendMessage(textToShow, "bot-message");

      } catch (error) {
        if (loadingDiv) loadingDiv.remove();
        appendMessage("⚠️ Erro de conexão com o motor Render. Tente novamente.", "bot-message");
      }
    }

    function appendMessage(content, className) {
      const chatContainer = document.getElementById("chat-container");
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${className}`;
      msgDiv.innerHTML = content;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgDiv;
    }
  </script>
</body>
</html>
