<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Radam Nox</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #12151e;
      --text-color: #f3f4f6;
      --accent-color: #8b5cf6;
      --user-msg: #2563eb;
      --bot-msg: #12151e;
      --border-color: rgba(255, 255, 255, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; overflow: hidden; }
    
    header {
      background-color: var(--card-bg);
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      font-weight: bold;
      font-size: 1.1rem;
      color: var(--accent-color);
    }

    .menu-btn { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; padding: 0.5rem; }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      max-width: 85%;
      padding: 0.9rem 1.1rem;
      border-radius: 12px;
      line-height: 1.4;
      word-break: break-word;
      font-size: 0.95rem;
    }
    .user-message { align-self: flex-end; background-color: var(--user-msg); color: white; }
    .bot-message { align-self: flex-start; background-color: var(--bot-msg); border: 1px solid var(--border-color); }

    #input-container {
      padding: 1rem;
      background-color: var(--card-bg);
      display: flex;
      gap: 0.8rem;
      align-items: center;
      border-top: 1px solid var(--border-color);
    }

    textarea {
      flex: 1;
      padding: 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      outline: none;
      resize: none;
      height: 44px;
      font-size: 1rem;
    }

    .send-btn {
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
      border: none;
      background-color: var(--accent-color);
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }
    .send-btn:disabled { opacity: 0.5; }
  </style>
</head>
<body>

  <header>
    <span>Radam Nox</span>
    <button class="menu-btn" onclick="alert('Radam Nox v1.0 Ativo')"><i class="fa-solid fa-bolt"></i></button>
  </header>

  <div id="chat-container">
    <div class="message bot-message">
      Olá, Blay! O motor do Radam Nox está pronto. Digite a sua mensagem abaixo.
    </div>
  </div>

  <div id="input-container">
    <textarea id="user-input" placeholder="Digite uma mensagem..." rows="1"></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMessage()">Enviar</button>
  </div>

  <script>
    const API_URL = "https://radamanthys-core.onrender.com/api/chat";

    async function sendMessage() {
      const inputField = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");
      const chatContainer = document.getElementById("chat-container");
      const messageText = inputField.value.trim();

      if (!messageText) return;

      appendMessage(messageText, "user-message");
      inputField.value = "";
      sendBtn.disabled = true;

      const loadingDiv = appendMessage("A contactar o motor no Render...", "bot-message");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: messageText })
        });

        const data = await response.json();
        loadingDiv.remove();

        if (!response.ok) {
          appendMessage(`⚠️️ ${data.error || 'Erro no servidor.'}`, "bot-message");
          return;
        }

        let textToShow = data.reply || data.response || data.message || (typeof data === "string" ? data : JSON.stringify(data));
        appendMessage(textToShow, "bot-message");

      } catch (error) {
        if (loadingDiv) loadingDiv.remove();
        appendMessage("⚠️ Erro de conexão com o Render. O servidor pode estar a acordar, tente novamente.", "bot-message");
      } finally {
        sendBtn.disabled = false;
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    }

    function appendMessage(content, className) {
      const chatContainer = document.getElementById("chat-container");
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${className}`;
      msgDiv.innerHTML = content;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgDiv;
    }

    // Suporte direto para tecla Enter
    document.getElementById("user-input").addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
