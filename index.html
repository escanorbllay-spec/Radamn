<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Radam Nox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0d0e15;
      --panel-bg: #161722;
      --card-bg: #1f202e;
      --purple-accent: #8b5cf6;
      --purple-glow: rgba(139, 92, 246, 0.3);
      --user-msg: #3b82f6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* HEADER */
    header {
      padding: 14px 18px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      position: relative;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1.3rem;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .title-area {
      font-weight: 700;
      font-size: 1.05rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
    }

    /* MENU DROPDOWN DE 3 PONTINHOS */
    #topMenuDropdown {
      display: none;
      position: absolute;
      top: 55px;
      right: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      padding: 8px;
      z-index: 80;
      flex-direction: column;
      min-width: 180px;
    }

    #topMenuDropdown.active {
      display: flex;
    }

    .dropdown-item {
      padding: 10px 14px;
      font-size: 0.88rem;
      color: var(--text-main);
      border: none;
      background: transparent;
      text-align: left;
      cursor: pointer;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.2s ease;
    }

    .dropdown-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .dropdown-item.danger {
      color: #f87171;
    }

    /* MENU LATERAL (SIDEBAR) */
    #sidebarOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 90;
      backdrop-filter: blur(4px);
    }

    #sidebar {
      position: fixed;
      top: 0;
      left: -290px;
      width: 290px;
      height: 100%;
      background: #11121c;
      border-right: 1px solid var(--border-color);
      z-index: 100;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      padding: 18px;
    }

    #sidebar.active {
      left: 0;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .new-chat-btn {
      width: 100%;
      padding: 12px;
      background: var(--purple-accent);
      border: none;
      color: white;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px var(--purple-glow);
    }

    .history-section {
      flex: 1;
      overflow-y: auto;
    }

    .history-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .history-item {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      color: var(--text-main);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }

    .history-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    /* CHAT CONTAINER */
    #chatContainer {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .user-wrapper {
      align-items: flex-end;
    }

    .user-msg {
      background: var(--user-msg);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .ai-wrapper {
      align-items: flex-start;
    }

    .ai-msg {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
    }

    .msg-actions {
      display: flex;
      gap: 8px;
      padding: 0 4px;
    }

    .action-icon {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
    }

    .chat-img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 10px;
      margin-bottom: 8px;
      display: block;
    }

    /* PREVIEW DA IMAGEM */
    #imagePreviewContainer {
      display: none;
      padding: 8px 16px;
      background: var(--panel-bg);
      border-top: 1px solid var(--border-color);
      align-items: center;
      gap: 12px;
    }

    #imagePreview {
      max-height: 50px;
      border-radius: 8px;
      border: 1px solid var(--purple-accent);
    }

    .remove-btn {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    /* MODAL DE FERRAMENTAS (+) */
    #toolsModalOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 95;
      align-items: flex-end;
      backdrop-filter: blur(2px);
    }

    #toolsModal {
      width: 100%;
      background: #161722;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px 20px 32px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 50vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .tool-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      text-align: center;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .tool-card:active {
      transform: scale(0.96);
      border-color: var(--purple-accent);
    }

    .tool-card-icon {
      font-size: 1.5rem;
    }

    /* FOOTER / INPUT */
    footer {
      padding: 12px 16px;
      background: var(--panel-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .input-bar {
      flex: 1;
      display: flex;
      align-items: center;
      background: #0d0e15;
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 4px 14px;
    }

    .input-bar:focus-within {
      border-color: var(--purple-accent);
      box-shadow: 0 0 12px var(--purple-glow);
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 8px;
      border: none;
      background: transparent;
      color: #ffffff;
      outline: none;
      font-size: 0.95rem;
    }

    .send-btn {
      padding: 10px 20px;
      background: var(--purple-accent);
      border: none;
      color: white;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px var(--purple-glow);
    }
  </style>
</head>
<body>

  <!-- OVERLAY E SIDEBAR DO MENU LATERAL -->
  <div id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="title-area">Radam Nox</div>
      <button class="icon-btn" onclick="toggleSidebar()">✕</button>
    </div>
    <button class="new-chat-btn" onclick="newChat()">+ Nova conversa</button>
    <div class="history-section">
      <div class="history-title">Recentes</div>
      <div class="history-item" onclick="selectHistory('Análise de Código')">💻 Análise de Código</div>
      <div class="history-item" onclick="selectHistory('Planejamento de Projeto')">🚀 Planejamento de Projeto</div>
    </div>
  </div>

  <!-- HEADER DA PÁGINA -->
  <header>
    <div class="header-left">
      <button class="icon-btn" onclick="toggleSidebar()">☰</button>
      <div class="title-area">
        <div class="status-dot"></div>
        Radam Nox
      </div>
    </div>
    <button class="icon-btn" onclick="toggleTopMenu(event)">⋮</button>

    <!-- MENU DROPDOWN SUPERIOR -->
    <div id="topMenuDropdown">
      <button class="dropdown-item" onclick="menuAction('Compartilhar')">🔗 Compartilhar</button>
      <button class="dropdown-item" onclick="menuAction('Renomear')">✏️ Renomear</button>
      <button class="dropdown-item danger" onclick="menuAction('Excluir')">🗑️️ Excluir conversa</button>
    </div>
  </header>

  <!-- ÁREA DE MENSAGENS -->
  <div id="chatContainer"></div>

  <!-- PREVIEW DE IMAGEM -->
  <div id="imagePreviewContainer">
    <img id="imagePreview" src="" alt="Preview">
    <button type="button" class="remove-btn" onclick="clearSelectedImage()">✕ Remover</button>
  </div>

  <!-- MODAL DE FERRAMENTAS (+) -->
  <div id="toolsModalOverlay" onclick="closeToolsModal(event)">
    <div id="toolsModal">
      <div class="modal-title">Anexos e Arquivos</div>
      
      <div class="tool-grid">
        <div class="tool-card" onclick="triggerFileInput()">
          <div class="tool-card-icon">🖼️</div>
          <div>Fotos</div>
        </div>
        <div class="tool-card" onclick="triggerFileInput()">
          <div class="tool-card-icon">📷</div>
          <div>Câmera</div>
        </div>
        <div class="tool-card" onclick="triggerFileInput()">
          <div class="tool-card-icon">📁</div>
          <div>Arquivos</div>
        </div>
        <div class="tool-card" onclick="triggerFileInput()">
          <div class="tool-card-icon">☁️</div>
          <div>Drive</div>
        </div>
      </div>
    </div>
  </div>

  <!-- INPUT DE ARQUIVOS (INVISÍVEL) -->
  <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">

  <!-- RODAPÉ DE ENVIO -->
  <footer>
    <div class="input-bar">
      <button class="icon-btn" onclick="openToolsModal()">+</button>
      <input type="text" id="messageInput" placeholder="Peça ao Radam Nox..." onkeypress="handleKeyPress(event)">
    </div>
    <button class="send-btn" onclick="sendMessage()">Enviar</button>
  </footer>

  <script>
    const BACKEND_URL = "https://radamn.onrender.com";
    let selectedBase64Image = null;
    
    window.conversationHistory = [];

    /* CONTROLE DOS MENUS E MODAIS */
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      const isActive = sidebar.classList.contains('active');
      
      if (isActive) {
        sidebar.classList.remove('active');
        overlay.style.display = 'none';
      } else {
        sidebar.classList.add('active');
        overlay.style.display = 'block';
      }
    }

    function toggleTopMenu(e) {
      e.stopPropagation();
      const dropdown = document.getElementById('topMenuDropdown');
      dropdown.classList.toggle('active');
    }

    // Fecha o dropdown se clicar fora dele
    window.addEventListener('click', () => {
      document.getElementById('topMenuDropdown').classList.remove('active');
    });

    function menuAction(acao) {
      document.getElementById('topMenuDropdown').classList.remove('active');
      if (acao === 'Excluir') {
        newChat();
      }
    }

    function openToolsModal() {
      document.getElementById('toolsModalOverlay').style.display = 'flex';
    }

    function closeToolsModal(e) {
      if (e.target.id === 'toolsModalOverlay') {
        document.getElementById('toolsModalOverlay').style.display = 'none';
      }
    }

    function triggerFileInput() {
      document.getElementById('toolsModalOverlay').style.display = 'none';
      document.getElementById('fileInput').click();
    }

    function newChat() {
      window.conversationHistory = [];
      document.getElementById('chatContainer').innerHTML = '';
      if (document.getElementById('sidebar').classList.contains('active')) {
        toggleSidebar();
      }
    }

    function selectHistory(title) {
      toggleSidebar();
      const input = document.getElementById('messageInput');
      input.value = `Continuar conversa sobre: ${title}`;
      sendMessage();
    }

    /* LÓGICA DE ENVIOS E RESPOSTAS */
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        selectedBase64Image = e.target.result;
        document.getElementById('imagePreview').src = selectedBase64Image;
        document.getElementById('imagePreviewContainer').style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function clearSelectedImage() {
      selectedBase64Image = null;
      document.getElementById('fileInput').value = '';
      document.getElementById('imagePreviewContainer').style.display = 'none';
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    function renderMessage(text, imageBase64, isUser) {
      const chatContainer = document.getElementById('chatContainer');
      
      const wrapper = document.createElement('div');
      wrapper.className = `message-wrapper ${isUser ? 'user-wrapper' : 'ai-wrapper'}`;

      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${isUser ? 'user-msg' : 'ai-msg'}`;

      if (imageBase64) {
        const imgEl = document.createElement('img');
        imgEl.src = imageBase64;
        imgEl.className = 'chat-img';
        msgDiv.appendChild(imgEl);
      }

      if (text) {
        const textEl = document.createElement('p');
        textEl.textContent = text;
        msgDiv.appendChild(textEl);
      }

      wrapper.appendChild(msgDiv);

      if (!isUser) {
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'msg-actions';
        actionsDiv.innerHTML = `
          <button class="action-icon" onclick="navigator.clipboard.writeText('${text.replace(/'/g, "\\'")}')">📋 Copiar</button>
        `;
        wrapper.appendChild(actionsDiv);
      }

      chatContainer.appendChild(wrapper);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function sendMessage() {
      const inputEl = document.getElementById('messageInput');
      const messageText = inputEl.value.trim();

      if (!messageText && !selectedBase64Image) return;

      const currentImage = selectedBase64Image;
      renderMessage(messageText, currentImage, true);

      let userEntryContent = messageText;
      if (currentImage) {
        userEntryContent = [];
        if (messageText) userEntryContent.push({ type: "text", text: messageText });
        userEntryContent.push({ type: "image_url", image_url: { url: currentImage } });
      }

      window.conversationHistory.push({
        role: "user",
        content: userEntryContent
      });

      inputEl.value = '';
      clearSelectedImage();

      try {
        const endpoint = `${BACKEND_URL.replace(/\/$/, '')}/api/chat`;
        
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: window.conversationHistory,
            message: messageText
          })
        });

        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error || 'Erro na resposta do servidor.');
        }

        const reply = data.reply || data.message || data.text || 'Sem resposta recebida.';
        
        window.conversationHistory.push({
          role: "assistant",
          content: reply
        });

        renderMessage(reply, null, false);
      } catch (err) {
        console.error('Erro de conexão:', err);
        renderMessage(`Erro do Servidor: ${err.message || 'Não foi possível conectar ao Radam Nox.'}`, null, false);
      }
    }
  </script>
</body>
</html>
