<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Radam Nox - Next-Gen AI Interface</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #090d16;
      --sidebar-bg: #111623;
      --card-bg: rgba(20, 27, 41, 0.75);
      --card-hover: rgba(30, 41, 62, 0.9);
      --text-color: #f0f6fc;
      --text-muted: #8b949e;
      --accent-gradient: linear-gradient(135deg, #7c3aed 0%, #3b82f6 50%, #06b6d4 100%);
      --accent-purple: #8b5cf6;
      --user-msg: #2563eb;
      --bot-msg: #131927;
      --border-color: rgba(255, 255, 255, 0.08);
      --sidebar-width: 280px;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }

    html, body {
      height: 100%;
      height: 100dvh;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow: hidden;
    }

    body {
      display: flex;
      width: 100vw;
    }

    /* Sidebar Flutuante */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100dvh;
      width: var(--sidebar-width);
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
    }

    .sidebar.active { transform: translateX(0); }

    .sidebar-header {
      padding: 1.2rem 1rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.2rem;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .new-chat-btn {
      width: 100%;
      padding: 0.8rem;
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 12px;
      color: #a78bfa;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .new-chat-btn:active { transform: scale(0.98); }

    .chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 0.8rem 0.5rem;
    }

    /* Layout Principal */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      position: relative;
    }

    header {
      padding: 0.8rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
      z-index: 10;
    }

    .menu-toggle {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.4rem;
    }

    .model-select {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      outline: none;
      font-weight: 500;
    }

    /* Área de Chat & Welcome Hero */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      -webkit-overflow-scrolling: touch;
    }

    /* Tela Inicial */
    .welcome-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto 0;
      text-align: center;
      padding: 1.5rem 0.5rem;
      animation: fadeIn 0.4s ease-in-out;
    }

    .welcome-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: white;
      margin-bottom: 1.2rem;
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.4);
    }

    .welcome-title {
      font-size: 1.9rem;
      font-weight: 800;
      margin-bottom: 0.4rem;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 2rem;
      max-width: 320px;
    }

    /* Grid de Sugestões Rápidas */
    .suggestions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.8rem;
      width: 100%;
      max-width: 500px;
    }

    @media (max-width: 480px) {
      .suggestions-grid { grid-template-columns: 1fr; }
    }

    .suggestion-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 0.9rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .suggestion-card:active {
      transform: scale(0.97);
      background: var(--card-hover);
    }

    .card-icon {
      font-size: 1.2rem;
      color: #a78bfa;
    }

    .card-text {
      font-size: 0.85rem;
      color: var(--text-color);
      font-weight: 500;
      line-height: 1.3;
    }

    /* Mensagens no Chat */
    .message-wrapper {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      max-width: 88%;
      animation: fadeIn 0.3s ease;
    }

    .user-wrapper { align-self: flex-end; }
    .bot-wrapper { align-self: flex-start; }

    .message {
      padding: 0.9rem 1.1rem;
      border-radius: 16px;
      line-height: 1.5;
      word-break: break-word;
      font-size: 0.95rem;
    }

    .user-message {
      background-color: var(--user-msg);
      color: white;
      border-bottom-right-radius: 4px;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.25);
    }

    .bot-message {
      background-color: var(--bot-msg);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
    }

    /* Accordion Processo de Raciocínio */
    .thinking-accordion {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      font-size: 0.82rem;
      margin-bottom: 0.3rem;
    }

    .thinking-header {
      padding: 0.5rem 0.8rem;
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
    }

    .thinking-content {
      padding: 0.6rem 0.8rem;
      display: none;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      white-space: pre-wrap;
    }

    .thinking-accordion.open .thinking-content { display: block; }

    /* Bolinhas de Carregamento */
    .bouncing-dots {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 0.4rem 0;
    }

    .dot {
      width: 7px;
      height: 7px;
      background-color: var(--accent-purple);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1.0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Toolbar de Ações */
    .actions-toolbar {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.2rem;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.3rem 0.5rem;
      border-radius: 6px;
    }

    /* Barra de Digitação em Cápsula Flutuante */
    #input-container {
      padding: 0.8rem 1rem 1.2rem 1rem;
      background: var(--bg-color);
      flex-shrink: 0;
      width: 100%;
    }

    .attachment-preview {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.4rem;
    }

    .preview-item {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .preview-item img { width: 100%; height: 100%; object-fit: cover; }

    .input-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background-color: var(--sidebar-bg);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 0.5rem 0.9rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
      transition: border-color 0.2s;
    }

    .input-box:focus-within {
      border-color: var(--accent-purple);
    }

    textarea {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-color);
      outline: none;
      resize: none;
      max-height: 100px;
      font-size: 0.95rem;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0.4rem;
      border-radius: 50%;
      transition: color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover, .icon-btn:active { color: #a78bfa; }

    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <!-- Menu Lateral / Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="brand-title">Radam Nox</span>
      <button type="button" class="menu-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div style="padding: 0.8rem;">
      <button type="button" class="new-chat-btn" onclick="startNewChat()"><i class="fa-solid fa-plus"></i> Novo Chat</button>
    </div>
    <div class="chat-history" id="chat-history"></div>
  </aside>

  <div class="main-container">
    <header>
      <div style="display: flex; align-items: center; gap: 0.8rem;">
        <button type="button" class="menu-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
        <span class="brand-title">Radam Nox</span>
      </div>
      <select class="model-select" id="model-select">
        <option value="radam-nox-fast">Nox Fast</option>
        <option value="radam-nox-thinker">Nox Thinker</option>
      </select>
    </header>

    <!-- Área Principal do Chat -->
    <div id="chat-container">
      <div class="welcome-hero" id="welcome-hero">
        <div class="welcome-icon"><i class="fa-solid fa-bolt"></i></div>
        <h1 class="welcome-title">Olá, Blay</h1>
        <p class="welcome-subtitle">Como posso te ajudar no Radam Nox hoje?</p>
        
        <div class="suggestions-grid">
          <div class="suggestion-card" onclick="sendQuickPrompt('Escreva um script de automação em Python')">
            <i class="fa-solid fa-code card-icon"></i>
            <span class="card-text">Criar script em Python</span>
          </div>
          <div class="suggestion-card" onclick="sendQuickPrompt('Analise uma arquitetura de microsserviços para o meu backend')">
            <i class="fa-solid fa-network-wired card-icon"></i>
            <span class="card-text">Arquitetura de Software</span>
          </div>
          <div class="suggestion-card" onclick="sendQuickPrompt('Pesquise e resuma as principais novidades de IA')">
            <i class="fa-solid fa-globe card-icon"></i>
            <span class="card-text">Pesquisa Web em Tempo Real</span>
          </div>
          <div class="suggestion-card" onclick="sendQuickPrompt('Ajude a revisar e otimizar meu código no GitHub')">
            <i class="fa-solid fa-bug card-icon"></i>
            <span class="card-text">Revisar e Refatorar Código</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Barra de Digitação em Cápsula -->
    <div id="input-container">
      <div class="attachment-preview" id="attachment-preview"></div>
      <div class="input-box">
        <button type="button" class="icon-btn" onclick="triggerFileInput()" title="Anexar arquivo">
          <i class="fa-solid fa-paperclip"></i>
        </button>
        <button type="button" class="icon-btn" onclick="triggerCameraInput()" title="Tirar foto">
          <i class="fa-solid fa-camera"></i>
        </button>
        
        <textarea id="user-input" rows="1" placeholder="Pergunte qualquer coisa ao Radam Nox..." oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>

        <button type="button" class="icon-btn" id="mic-btn" onclick="toggleVoiceInput()" title="Voz">
          <i class="fa-solid fa-microphone"></i>
        </button>

        <button type="button" class="icon-btn" style="color: #a78bfa;" onclick="sendMessage()" id="send-btn">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
      </div>
    </div>
  </div>

  <input type="file" id="file-input" multiple onchange="handleFileSelect(event)">
  <input type="file" id="camera-input" accept="image/*" capture="environment" onchange="handleFileSelect(event)">

  <script>
    const API_URL = "https://radamanthys-core.onrender.com/api/chat";
    let selectedFiles = [];
    let isRecording = false;

    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("active");
    }

    function startNewChat() {
      const container = document.getElementById("chat-container");
      container.innerHTML = `
        <div class="welcome-hero" id="welcome-hero">
          <div class="welcome-icon"><i class="fa-solid fa-bolt"></i></div>
          <h1 class="welcome-title">Olá, Blay</h1>
          <p class="welcome-subtitle">Como posso te ajudar no Radam Nox hoje?</p>
          <div class="suggestions-grid">
            <div class="suggestion-card" onclick="sendQuickPrompt('Escreva um script de automação em Python')">
              <i class="fa-solid fa-code card-icon"></i>
              <span class="card-text">Criar script em Python</span>
            </div>
            <div class="suggestion-card" onclick="sendQuickPrompt('Analise uma arquitetura de microsserviços para o meu backend')">
              <i class="fa-solid fa-network-wired card-icon"></i>
              <span class="card-text">Arquitetura de Software</span>
            </div>
            <div class="suggestion-card" onclick="sendQuickPrompt('Pesquise e resuma as principais novidades de IA')">
              <i class="fa-solid fa-globe card-icon"></i>
              <span class="card-text">Pesquisa Web em Tempo Real</span>
            </div>
            <div class="suggestion-card" onclick="sendQuickPrompt('Ajude a revisar e otimizar meu código no GitHub')">
              <i class="fa-solid fa-bug card-icon"></i>
              <span class="card-text">Revisar e Refatorar Código</span>
            </div>
          </div>
        </div>`;
      if (document.getElementById("sidebar").classList.contains("active")) {
        toggleSidebar();
      }
    }

    function removeWelcomeHero() {
      const hero = document.getElementById("welcome-hero");
      if (hero) hero.remove();
    }

    function sendQuickPrompt(promptText) {
      document.getElementById("user-input").value = promptText;
      sendMessage();
    }

    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = (textarea.scrollHeight) + 'px';
      scrollToBottom();
    }

    function handleKeyDown(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    function scrollToBottom() {
      setTimeout(() => {
        const container = document.getElementById("chat-container");
        container.scrollTop = container.scrollHeight;
      }, 100);
    }

    function triggerFileInput() { document.getElementById('file-input').click(); }
    function triggerCameraInput() { document.getElementById('camera-input').click(); }

    function handleFileSelect(event) {
      const files = Array.from(event.target.files);
      files.forEach(file => {
        selectedFiles.push(file);
        const reader = new FileReader();
        reader.onload = (e) => {
          const previewContainer = document.getElementById("attachment-preview");
          const div = document.createElement("div");
          div.className = "preview-item";
          div.innerHTML = `<img src="${e.target.result}" alt="preview">`;
          previewContainer.appendChild(div);
        };
        reader.readAsDataURL(file);
      });
    }

    function toggleVoiceInput() {
      const micBtn = document.getElementById("mic-btn");
      try {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("O seu navegador não suporta reconhecimento de voz.");
          return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'pt-BR';

        if (!isRecording) {
          recognition.start();
          isRecording = true;
          micBtn.style.color = "#ef4444";

          recognition.onresult = (event) => {
            document.getElementById("user-input").value += event.results[0][0].transcript;
            micBtn.style.color = "var(--text-muted)";
            isRecording = false;
          };

          recognition.onerror = () => {
            micBtn.style.color = "var(--text-muted)";
            isRecording = false;
          };

          recognition.onend = () => {
            micBtn.style.color = "var(--text-muted)";
            isRecording = false;
          };
        }
      } catch (e) {
        alert("Erro ao iniciar o microfone.");
      }
    }

    async function sendMessage() {
      const inputField = document.getElementById("user-input");
      const messageText = inputField.value.trim();

      if (!messageText && selectedFiles.length === 0) return;

      removeWelcomeHero();
      appendUserMessage(messageText, selectedFiles);

      inputField.value = "";
      inputField.style.height = "auto";
      document.getElementById("attachment-preview").innerHTML = "";
      const currentFiles = [...selectedFiles];
      selectedFiles = [];

      const botWrapper = createBotLoadingMessage();

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: messageText })
        });

        const data = await response.json();
        botWrapper.remove();

        let replyText = data.reply || data.response || data.message || (typeof data === "string" ? data : JSON.stringify(data));
        appendBotResponse(replyText, "Processado com sucesso pelo motor Radam Nox.");

      } catch (error) {
        if (botWrapper) botWrapper.remove();
        appendBotResponse("⚠️ Ocorreu um erro ao conectar ao servidor do Radam Nox. Verifique se o servidor backend está online.");
      }
    }

    function appendUserMessage(text, files) {
      const container = document.getElementById("chat-container");
      const wrapper = document.createElement("div");
      wrapper.className = "message-wrapper user-wrapper";

      let imgsHtml = "";
      files.forEach(file => {
        imgsHtml += `<br><img src="${URL.createObjectURL(file)}" style="max-width:180px; border-radius:10px; margin-top:5px;">`;
      });

      wrapper.innerHTML = `<div class="message user-message">${text || ''} ${imgsHt
