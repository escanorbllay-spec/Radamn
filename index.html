<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Radam Nox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #050508;
      --panel-bg: #111118;
      --card-bg: #181824;
      --purple-accent: #7c3aed;
      --purple-glow: rgba(124, 58, 237, 0.5);
      --user-msg: #2563eb;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HEADER */
    header {
      padding: 14px 18px;
      background: #111118;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-action {
      background: #181824;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 10px 14px;
      border-radius: 8px;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-action:active {
      background: var(--purple-accent);
    }

    .title-area {
      font-weight: 700;
      font-size: 1.05rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
    }

    /* DROPDOWN SUPERIOR DE TRÊS PONTOS */
    #topMenuDropdown {
      display: none;
      position: absolute;
      top: 60px;
      right: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 8px;
      z-index: 500;
      flex-direction: column;
      min-width: 180px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .dropdown-item {
      padding: 12px;
      font-size: 0.9rem;
      color: var(--text-main);
      border: none;
      background: transparent;
      text-align: left;
      cursor: pointer;
      border-radius: 8px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dropdown-item:active {
      background: rgba(255, 255, 255, 0.1);
    }

    /* SIDEBAR (MENU LATERAL) */
    #sidebarOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      z-index: 900;
    }

    #sidebar {
      position: fixed;
      top: 0; left: -290px;
      width: 290px; height: 100%;
      background: #0a0a10;
      border-right: 1px solid var(--border-color);
      z-index: 1000;
      transition: left 0.25s ease;
      padding: 18px;
      display: flex;
      flex-direction: column;
    }

    /* MAIN / BOAS-VINDAS */
    #mainArea {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      gap: 15px;
    }

    .welcome-title {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(180deg, #ffffff 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ÁREA DE MENSAGENS / CHAT */
    #chatContainer {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .msg-user {
      align-self: flex-end;
      background: var(--user-msg);
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 80%;
      word-break: break-word;
    }

    .msg-ai {
      align-self: flex-start;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 85%;
      word-break: break-word;
      line-height: 1.4;
    }

    .msg-loading {
      align-self: flex-start;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-style: italic;
    }

    /* MODAL DE ANEXOS FERRAMENTAS (+) */
    #toolsModalOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.7);
      z-index: 950;
      align-items: flex-end;
    }

    #toolsModal {
      width: 100%;
      background: #111118;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .tool-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 15px 5px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      font-size: 0.8rem;
    }

    /* FOOTER */
    footer {
      padding: 12px;
      background: #111118;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
      position: relative;
      z-index: 10;
    }

    .input-bar {
      flex: 1;
      display: flex;
      align-items: center;
      background: #08080d;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 0 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: white;
      outline: none;
    }
  </style>
</head>
<body>

  <!-- OVERLAY E SIDEBAR -->
  <div id="sidebarOverlay"></div>
  <div id="sidebar">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h3 style="color:#fff;">Radam Nox</h3>
      <button class="btn-action" id="btnCloseSidebar">✕</button>
    </div>
    <button class="btn-action" id="btnNewChat" style="width:100%; margin-bottom:15px; background:var(--purple-accent);">+ Nova conversa</button>
    <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:10px;">RECENTES</div>
    <div class="btn-action" id="btnHist1" style="margin-bottom:8px; text-align:left; width:100%;">💻 Análise de Código</div>
  </div>

  <!-- HEADER -->
  <header>
    <div class="header-left">
      <button class="btn-action" id="btnOpenSidebar">☰</button>
      <div class="title-area">
        <div class="status-dot"></div>
        Radam Nox
      </div>
    </div>
    <button class="btn-action" id="btnTopMenu">⋮</button>

    <!-- MENU DROPDOWN -->
    <div id="topMenuDropdown">
      <button class="dropdown-item" id="btnActionShare">🔗 Compartilhar</button>
      <button class="dropdown-item" id="btnActionRename">✏️ Renomear</button>
      <button class="dropdown-item" id="btnActionDelete" style="color:#f87171;">🗑 Excluir conversa</button>
    </div>
  </header>

  <!-- TELA INICIAL / WELCOME -->
  <div id="mainArea">
    <div class="welcome-title">RADAM NOX</div>
    <p style="color:var(--text-muted)">Boas-vindas, KALNOOX RADAMN! No que posso ajudar?</p>
  </div>

  <!-- CONTAINER DE MENSAGENS DO CHAT -->
  <div id="chatContainer"></div>

  <!-- MODAL DE ANEXOS (+) -->
  <div id="toolsModalOverlay">
    <div id="toolsModal">
      <div style="font-size:0.8rem; color:var(--text-muted);">ANEXOS E ARQUIVOS</div>
      <div class="tool-grid">
        <div class="tool-card" id="btnToolPhoto">🖼️<br>Fotos</div>
        <div class="tool-card" id="btnToolCamera">📷<br>Câmera</div>
        <div class="tool-card" id="btnToolFile">📁<br>Arquivos</div>
        <div class="tool-card" id="btnToolDrive">☁️<br>Drive</div>
      </div>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*" style="display:none;">

  <!-- FOOTER E CAMPO DE TEXTO -->
  <footer>
    <div class="input-bar">
      <button class="btn-action" id="btnOpenTools" style="border:none; background:transparent;">+</button>
      <input type="text" id="messageInput" placeholder="Peça ao Radam Nox...">
    </div>
    <button class="btn-action" id="btnSend" style="background:var(--purple-accent);">Enviar</button>
  </footer>

  <script>
    const BACKEND_URL = "https://radamn.onrender.com";
    window.conversationHistory = [];

    window.onload = function() {
      const sidebar = document.getElementById('sidebar');
      const sidebarOverlay = document.getElementById('sidebarOverlay');
      const topMenuDropdown = document.getElementById('topMenuDropdown');
      const toolsModalOverlay = document.getElementById('toolsModalOverlay');
      const fileInput = document.getElementById('fileInput');
      const messageInput = document.getElementById('messageInput');
      const chatContainer = document.getElementById('chatContainer');
      const mainArea = document.getElementById('mainArea');

      // 1. Sidebar (Menu Lateral)
      document.getElementById('btnOpenSidebar').onclick = function() {
        sidebar.style.left = "0px";
        sidebarOverlay.style.display = "block";
      };

      function closeSidebar() {
        sidebar.style.left = "-290px";
        sidebarOverlay.style.display = "none";
      }

      document.getElementById('btnCloseSidebar').onclick = closeSidebar;
      sidebarOverlay.onclick = closeSidebar;

      // 2. Menu Três Pontos Superior
      document.getElementById('btnTopMenu').onclick = function(e) {
        e.stopPropagation();
        const isVisible = topMenuDropdown.style.display === "flex";
        topMenuDropdown.style.display = isVisible ? "none" : "flex";
      };

      document.onclick = function() {
        if (topMenuDropdown.style.display === "flex") {
          topMenuDropdown.style.display = "none";
        }
      };

      document.getElementById('btnActionShare').onclick = function() { alert("Link da conversa copiado!"); };
      document.getElementById('btnActionRename').onclick = function() { alert("Opção de renomear ativada."); };
      document.getElementById('btnActionDelete').onclick = function() { resetChat(); };

      // 3. Modal de Anexos
      document.getElementById('btnOpenTools').onclick = function() {
        toolsModalOverlay.style.display = "flex";
      };

      toolsModalOverlay.onclick = function(e) {
        if (e.target === toolsModalOverlay) {
          toolsModalOverlay.style.display = "none";
        }
      };

      const triggerFile = function() {
        toolsModalOverlay.style.display = "none";
        fileInput.click();
      };

      document.getElementById('btnToolPhoto').onclick = triggerFile;
      document.getElementById('btnToolCamera').onclick = triggerFile;
      document.getElementById('btnToolFile').onclick = triggerFile;
      document.getElementById('btnToolDrive').onclick = triggerFile;

      // 4. Lógica de Limpeza e Envio Real de Mensagens
      function resetChat() {
        window.conversationHistory = [];
        chatContainer.innerHTML = "";
        chatContainer.style.display = "none";
        mainArea.style.display = "flex";
      }

      async function send(textToSend) {
        const txt = textToSend || messageInput.value.trim();
        if (!txt) return;

        mainArea.style.display = "none";
        chatContainer.style.display = "flex";

        // Adiciona mensagem do usuário na tela
        const userDiv = document.createElement('div');
        userDiv.className = "msg-user";
        userDiv.innerText = txt;
        chatContainer.appendChild(userDiv);

        window.conversationHistory.push({ role: "user", content: txt });
        messageInput.value = "";
        chatContainer.scrollTop = chatContainer.scrollHeight;

        // Indicador de resposta da IA
        const loadingDiv = document.createElement('div');
        loadingDiv.className = "msg-loading";
        loadingDiv.innerText = "Radam Nox está pensando...";
        chatContainer.appendChild(loadingDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        try {
          const endpoint = `${BACKEND_URL.replace(/\/$/, '')}/api/chat`;
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              messages: window.conversationHistory,
              message: txt
            })
          });

          if (chatContainer.contains(loadingDiv)) {
            chatContainer.removeChild(loadingDiv);
          }

          if (!response.ok) {
            throw new Error(`Servidor respondeu com status ${response.status}`);
          }

          const data = await response.json();
          const reply = data.reply || data.message || data.text || "Sem resposta do servidor.";

          window.conversationHistory.push({ role: "assistant", content: reply });

          const aiDiv = document.createElement('div');
          aiDiv.className = "msg-ai";
          aiDiv.innerText = reply;
          chatContainer.appendChild(aiDiv);

        } catch (err) {
          if (chatContainer.contains(loadingDiv)) {
            chatContainer.removeChild(loadingDiv);
          }
          const errDiv = document.createElement('div');
          errDiv.className = "msg-ai";
          errDiv.style.borderColor = "#f87171";
          errDiv.innerText = `Servidor indisponível ou em inicialização. (${err.message})`;
          chatContainer.appendChild(errDiv);
        }

        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      document.getElementById('btnSend').onclick = function() { send(); };
      messageInput.onkeypress = function(e) {
        if (e.key === 'Enter') send();
      };

      document.getElementById('btnNewChat').onclick = function() {
        closeSidebar();
        resetChat();
      };

      document.getElementById('btnHist1').onclick = function() {
        closeSidebar();
        send("Análise de código");
      };
    };
  </script>
</body>
</html>
