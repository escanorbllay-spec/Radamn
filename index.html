<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Radam Nox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #07070d;
      --card-bg: rgba(22, 22, 37, 0.75);
      --purple-main: #8b5cf6;
      --purple-glow: rgba(139, 92, 246, 0.35);
      --accent-cyan: #06b6d4;
      --user-bg: linear-gradient(135deg, #2563eb, #1d4ed8);
      --text-bright: #f8fafc;
      --text-dim: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: var(--text-bright);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh; /* Garante ajuste perfeito em celulares sem cortar o rodapé */
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(139, 92, 246, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(6, 182, 212, 0.05) 0%, transparent 50%);
    }

    /* BARRA SUPERIOR */
    header {
      padding: 16px;
      background: rgba(13, 13, 24, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 10;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      letter-spacing: 2px;
      color: var(--text-bright);
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffffff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ÁREA DO CHAT */
    #chatContainer {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    /* MENSAGENS */
    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
      animation: slideIn 0.2s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user-msg {
      align-self: flex-end;
      background: var(--user-bg);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }

    .ai-msg {
      align-self: flex-start;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .chat-img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 10px;
      margin-bottom: 8px;
      display: block;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* PREVIEW DE IMAGEM */
    #imagePreviewContainer {
      display: none;
      padding: 8px 16px;
      background: rgba(18, 18, 30, 0.9);
      border-top: 1px solid var(--border-color);
      align-items: center;
      gap: 12px;
    }

    #imagePreview {
      max-height: 50px;
      border-radius: 8px;
      border: 1px solid var(--purple-main);
    }

    .remove-btn {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* RODAPÉ E BARRA DE ENVIO */
    footer {
      padding: 12px 16px;
      background: rgba(13, 13, 24, 0.95);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .input-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2px 8px;
      transition: all 0.2s ease;
    }

    .input-wrapper:focus-within {
      border-color: var(--purple-main);
      box-shadow: 0 0 12px var(--purple-glow);
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 8px;
      border: none;
      background: transparent;
      color: #ffffff;
      outline: none;
      font-size: 0.95rem;
    }

    input[type="text"]::placeholder {
      color: var(--text-dim);
    }

    .attach-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 1.2rem;
      padding: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .attach-btn:hover {
      color: var(--purple-main);
    }

    .action-btn {
      padding: 12px 18px;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      border: none;
      color: #ffffff;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 4px 12px var(--purple-glow);
      transition: transform 0.1s, opacity 0.2s;
    }

    .action-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <header>
    <div class="status-dot"></div>
    <h1>Radam Nox</h1>
  </header>

  <div id="chatContainer"></div>

  <div id="imagePreviewContainer">
    <img id="imagePreview" src="" alt="Preview">
    <button type="button" class="remove-btn" onclick="clearSelectedImage()">✕ Remover</button>
  </div>

  <footer>
    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
    <div class="input-wrapper">
      <button type="button" class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Anexar Imagem">📎</button>
      <input type="text" id="messageInput" placeholder="Mensagem..." onkeypress="handleKeyPress(event)">
    </div>
    <button type="button" class="action-btn" onclick="sendMessage()">Enviar</button>
  </footer>

  <script>
    const BACKEND_URL = "https://radamn.onrender.com";
    let selectedBase64Image = null;
    
    // Armazena todas as interações da sessão atual
    window.conversationHistory = [];

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        selectedBase64Image = e.target.result;
        document.getElementById('imagePreview').src = selectedBase64Image;
        document.getElementById('imagePreviewContainer').style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function clearSelectedImage() {
      selectedBase64Image = null;
      document.getElementById('fileInput').value = '';
      document.getElementById('imagePreviewContainer').style.display = 'none';
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    function renderMessage(text, imageBase64, isUser) {
      const chatContainer = document.getElementById('chatContainer');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${isUser ? 'user-msg' : 'ai-msg'}`;

      if (imageBase64) {
        const imgEl = document.createElement('img');
        imgEl.src = imageBase64;
        imgEl.className = 'chat-img';
        msgDiv.appendChild(imgEl);
      }

      if (text) {
        const textEl = document.createElement('p');
        textEl.textContent = text;
        msgDiv.appendChild(textEl);
      }

      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function sendMessage() {
      const inputEl = document.getElementById('messageInput');
      const messageText = inputEl.value.trim();

      if (!messageText && !selectedBase64Image) return;

      const currentImage = selectedBase64Image;
      renderMessage(messageText, currentImage, true);

      // Prepara a entrada do usuário
      let userEntryContent = messageText;
      if (currentImage) {
        userEntryContent = [];
        if (messageText) userEntryContent.push({ type: "text", text: messageText });
        userEntryContent.push({ type: "image_url", image_url: { url: currentImage } });
      }

      // Adiciona a mensagem atual ao histórico global
      window.conversationHistory.push({
        role: "user",
        content: userEntryContent
      });

      inputEl.value = '';
      clearSelectedImage();

      try {
        const endpoint = `${BACKEND_URL.replace(/\/$/, '')}/api/chat`;
        
        // Envia o array de histórico completo
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: window.conversationHistory,
            message: messageText
          })
        });

        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error || 'Erro na resposta do servidor.');
        }

        const reply = data.reply || data.message || data.text || 'Sem resposta recebida.';
        
        // Adiciona a resposta da IA ao histórico global
        window.conversationHistory.push({
          role: "assistant",
          content: reply
        });

        renderMessage(reply, null, false);
      } catch (err) {
        console.error('Erro de conexão:', err);
        renderMessage(`Erro do Servidor: ${err.message || 'Não foi possível conectar ao Radam Nox.'}`, null, false);
      }
    }
  </script>
</body>
</html>
