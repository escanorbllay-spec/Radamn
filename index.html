<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Radam Nox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #050508;
      --panel-bg: #111118;
      --card-bg: #181824;
      --purple-accent: #7c3aed;
      --purple-glow: rgba(124, 58, 237, 0.5);
      --user-msg: #2563eb;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100vw;
      height: 100dvh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HEADER */
    header {
      padding: 14px 18px;
      background: #111118;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 10;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-action {
      background: #181824;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 10px 14px;
      border-radius: 8px;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-action:active {
      background: var(--purple-accent);
    }

    .title-area {
      font-weight: 700;
      font-size: 1.05rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
    }

    /* DROPDOWN SUPERIOR */
    #topMenuDropdown {
      display: none;
      position: absolute;
      top: 60px;
      right: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 8px;
      z-index: 500;
      flex-direction: column;
      min-width: 180px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .dropdown-item {
      padding: 12px;
      font-size: 0.9rem;
      color: var(--text-main);
      border: none;
      background: transparent;
      text-align: left;
      cursor: pointer;
      border-radius: 8px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dropdown-item:active {
      background: rgba(255, 255, 255, 0.1);
    }

    /* SIDEBAR */
    #sidebarOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      z-index: 900;
    }

    #sidebar {
      position: fixed;
      top: 0; left: -290px;
      width: 290px; height: 100%;
      background: #0a0a10;
      border-right: 1px solid var(--border-color);
      z-index: 1000;
      transition: left 0.25s ease;
      padding: 18px;
      display: flex;
      flex-direction: column;
    }

    /* MAIN / BOAS-VINDAS */
    #mainArea {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      gap: 15px;
      overflow-y: auto;
    }

    .welcome-title {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(180deg, #ffffff 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ÁREA DE CHAT */
    #chatContainer {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .msg-user {
      align-self: flex-end;
      background: var(--user-msg);
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 80%;
      word-break: break-word;
    }

    .msg-ai {
      align-self: flex-start;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 85%;
      word-break: break-word;
      line-height: 1.4;
    }

    .msg-loading {
      align-self: flex-start;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-style: italic;
    }

    .msg-preview-img {
      max-width: 200px;
      max-height: 200px;
      border-radius: 8px;
      margin-bottom: 6px;
      display: block;
    }

    /* MODAL DE ANEXOS (+) COM SVG ATUALIZADO */
    #toolsModalOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 950;
      align-items: flex-end;
    }

    #toolsModal {
      width: 100%;
      background: #111118;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px 20px 35px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .tool-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 16px 8px;
      border-radius: 16px;
      text-align: center;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s;
    }

    .tool-card:active {
      transform: scale(0.96);
      background: #202030;
    }

    .tool-card svg {
      width: 26px;
      height: 26px;
      stroke: #a855f7;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* BARRA DE PREVIEW */
    #attachmentPreviewBar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: #181824;
      border-top: 1px solid var(--border-color);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* FOOTER */
    footer {
      padding: 12px 12px 25px 12px;
      background: #111118;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
      position: relative;
      z-index: 10;
      flex-shrink: 0;
      width: 100%;
      align-items: center;
    }

    .input-bar {
      flex: 1;
      display: flex;
      align-items: center;
      background: #08080d;
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 4px 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: white;
      outline: none;
      font-size: 0.95rem;
    }

    .btn-dynamic {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: var(--purple-accent);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .btn-dynamic.waves {
      background: #1d1b26;
      color: #a855f7;
      font-size: 1.1rem;
      letter-spacing: -2px;
    }

    .btn-dynamic.stop {
      background: #262636;
      color: #ffffff;
      border: 1px solid var(--border-color);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- OVERLAY E SIDEBAR -->
  <div id="sidebarOverlay"></div>
  <div id="sidebar">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h3 style="color:#fff;">Radam Nox</h3>
      <button class="btn-action" id="btnCloseSidebar">✕</button>
    </div>
    <button class="btn-action" id="btnNewChat" style="width:100%; margin-bottom:15px; background:var(--purple-accent);">+ Nova conversa</button>
    <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:10px;">RECENTES</div>
    <div class="btn-action" id="btnHist1" style="margin-bottom:8px; text-align:left; width:100%;">💻 Análise de Código</div>
  </div>

  <!-- HEADER -->
  <header>
    <div class="header-left">
      <button class="btn-action" id="btnOpenSidebar">☰</button>
      <div class="title-area">
        <div class="status-dot"></div>
        Radam Nox
      </div>
    </div>
    <button class="btn-action" id="btnTopMenu">⋮</button>

    <!-- MENU DROPDOWN -->
    <div id="topMenuDropdown">
      <button class="dropdown-item" id="btnActionShare">🔗 Compartilhar</button>
      <button class="dropdown-item" id="btnActionRename">✏️ Renomear</button>
      <button class="dropdown-item" id="btnActionDelete" style="color:#f87171;">🗑 Excluir conversa</button>
    </div>
  </header>

  <!-- TELA INICIAL -->
  <div id="mainArea">
    <div class="welcome-title">RADAM NOX</div>
    <p style="color:var(--text-muted)">Boas-vindas! No que posso ajudar?</p>
  </div>

  <!-- CONTAINER DE MENSAGENS DO CHAT -->
  <div id="chatContainer"></div>

  <!-- MODAL DE ANEXOS ATUALIZADO COM SVG MODERNOS -->
  <div id="toolsModalOverlay">
    <div id="toolsModal">
      <div style="font-size:0.8rem; color:var(--text-muted); font-weight:600;">ANEXOS E FERRAMENTAS</div>
      <div class="tool-grid">
        
        <!-- Fotos -->
        <div class="tool-card" id="btnToolPhoto">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="5" ry="5"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          <span>Fotos</span>
        </div>

        <!-- Câmera -->
        <div class="tool-card" id="btnToolCamera">
          <svg viewBox="0 0 24 24">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          <span>Câmera</span>
        </div>

        <!-- Arquivos -->
        <div class="tool-card" id="btnToolFile">
          <svg viewBox="0 0 24 24">
            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
            <polyline points="13 2 13 9 20 9"></polyline>
          </svg>
          <span>Arquivos</span>
        </div>

        <!-- Nuvem / Drive -->
        <div class="tool-card" id="btnToolDrive">
          <svg viewBox="0 0 24 24">
            <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
          </svg>
          <span>Drive</span>
        </div>

      </div>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*,application/pdf,text/*" style="display:none;">

  <!-- BARRA DE PREVIEW -->
  <div id="attachmentPreviewBar">
    <span id="attachmentFileName"></span>
    <button id="btnRemoveAttachment" style="background:none; border:none; color:#f87171; cursor:pointer; font-size:1rem; margin-left:auto;">✕</button>
  </div>

  <!-- FOOTER -->
  <footer>
    <div class="input-bar">
      <button class="btn-action" id="btnOpenTools" style="border:none; background:transparent;">+</button>
      <input type="text" id="messageInput" placeholder="Peça ao Radam Nox...">
    </div>
    <button class="btn-dynamic waves" id="btnActionDynamic">❙❚❙</button>
  </footer>

  <script>
    const BACKEND_URL = "https://radamn.onrender.com";
    window.conversationHistory = [];
    let isProcessing = false;
    let abortController = null;
    let pendingAttachment = null;

    function saveHistoryToStorage() {
      try {
        localStorage.setItem('radam_nox_history', JSON.stringify(window.conversationHistory));
      } catch (e) {}
    }

    function loadHistoryFromStorage() {
      try {
        const saved = localStorage.getItem('radam_nox_history');
        if (saved) {
          window.conversationHistory = JSON.parse(saved);
          if (window.conversationHistory.length > 0) {
            renderFullHistory();
          }
        }
      } catch (e) {}
    }

    function renderFullHistory() {
      const chatContainer = document.getElementById('chatContainer');
      const mainArea = document.getElementById('mainArea');
      chatContainer.innerHTML = "";

      if (window.conversationHistory.length === 0) {
        chatContainer.style.display = "none";
        mainArea.style.display = "flex";
        return;
      }

      mainArea.style.display = "none";
      chatContainer.style.display = "flex";

      window.conversationHistory.forEach(item => {
        const div = document.createElement('div');
        div.className = item.role === 'user' ? 'msg-user' : 'msg-ai';

        let htmlContent = '';
        if (item.image) {
          htmlContent += `<img src="${item.image}" class="msg-preview-img"><br>`;
        }
        htmlContent += item.content || '';
        div.innerHTML = htmlContent;

        chatContainer.appendChild(div);
      });

      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    window.onload = function() {
      const sidebar = document.getElementById('sidebar');
      const sidebarOverlay = document.getElementById('sidebarOverlay');
      const topMenuDropdown = document.getElementById('topMenuDropdown');
      const toolsModalOverlay = document.getElementById('toolsModalOverlay');
      const fileInput = document.getElementById('fileInput');
      const messageInput = document.getElementById('messageInput');
      const chatContainer = document.getElementById('chatContainer');
      const mainArea = document.getElementById('mainArea');
      const btnActionDynamic = document.getElementById('btnActionDynamic');
      const attachmentPreviewBar = document.getElementById('attachmentPreviewBar');
      const attachmentFileName = document.getElementById('attachmentFileName');
      const btnRemoveAttachment = document.getElementById('btnRemoveAttachment');

      loadHistoryFromStorage();

      function updateButtonState() {
        if (isProcessing) {
          btnActionDynamic.className = "btn-dynamic stop";
          btnActionDynamic.innerHTML = "⏹";
        } else if (messageInput.value.trim().length > 0 || pendingAttachment) {
          btnActionDynamic.className = "btn-dynamic";
          btnActionDynamic.innerHTML = "↑";
        } else {
          btnActionDynamic.className = "btn-dynamic waves";
          btnActionDynamic.innerHTML = "❙❚❙";
        }
      }

      messageInput.oninput = updateButtonState;

      function clearAttachment() {
        pendingAttachment = null;
        fileInput.value = '';
        attachmentPreviewBar.style.display = 'none';
        updateButtonState();
      }

      btnRemoveAttachment.onclick = clearAttachment;

      fileInput.onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
          pendingAttachment = {
            name: file.name,
            mimeType: file.type,
            base64: evt.target.result
          };

          attachmentFileName.innerText = `📎 ${file.name}`;
          attachmentPreviewBar.style.display = 'flex';
          updateButtonState();
        };
        reader.readAsDataURL(file);
      };

      document.getElementById('btnOpenSidebar').onclick = function() {
        sidebar.style.left = "0px";
        sidebarOverlay.style.display = "block";
      };

      function closeSidebar() {
        sidebar.style.left = "-290px";
        sidebarOverlay.style.display = "none";
      }

      document.getElementById('btnCloseSidebar').onclick = closeSidebar;
      sidebarOverlay.onclick = closeSidebar;

      document.getElementById('btnTopMenu').onclick = function(e) {
        e.stopPropagation();
        const isVisible = topMenuDropdown.style.display === "flex";
        topMenuDropdown.style.display = isVisible ? "none" : "flex";
      };

      document.onclick = function() {
        if (topMenuDropdown.style.display === "flex") {
          topMenuDropdown.style.display = "none";
        }
      };

      document.getElementById('btnActionShare').onclick = function() { alert("Link copiado!"); };
      document.getElementById('btnActionRename').onclick = function() { alert("Opção de renomear selecionada."); };
      document.getElementById('btnActionDelete').onclick = function() { resetChat(); };

      document.getElementById('btnOpenTools').onclick = function() {
        toolsModalOverlay.style.display = "flex";
      };

      toolsModalOverlay.onclick = function(e) {
        if (e.target === toolsModalOverlay) {
          toolsModalOverlay.style.display = "none";
        }
      };

      const triggerFile = function() {
        toolsModalOverlay.style.display = "none";
        fileInput.click();
      };

      document.getElementById('btnToolPhoto').onclick = triggerFile;
      document.getElementById('btnToolCamera').onclick = triggerFile;
      document.getElementById('btnToolFile').onclick = triggerFile;
      document.getElementById('btnToolDrive').onclick = triggerFile;

      function resetChat() {
        window.conversationHistory = [];
        localStorage.removeItem('radam_nox_history');
        chatContainer.innerHTML = "";
        chatContainer.style.display = "none";
        mainArea.style.display = "flex";
        isProcessing = false;
        clearAttachment();
        updateButtonState();
      }

      async function send(textToSend) {
        const txt = textToSend || messageInput.value.trim();

        if (!txt && !pendingAttachment && !isProcessing) return;

        if (isProcessing) {
          if (abortController) abortController.abort();
          isProcessing = false;
          updateButtonState();
          return;
        }

        isProcessing = true;
        updateButtonState();

        mainArea.style.display = "none";
        chatContainer.style.display = "flex";

        const userDiv = document.createElement('div');
        userDiv.className = "msg-user";

        let userHtml = '';
        let currentAttachment = pendingAttachment;

        if (currentAttachment && currentAttachment.mimeType.startsWith('image/')) {
          userHtml += `<img src="${currentAttachment.base64}" class="msg-preview-img"><br>`;
        } else if (currentAttachment) {
          userHtml += `<div style="font-size:0.8rem; opacity:0.8;">📎 ${currentAttachment.name}</div>`;
        }

        userHtml += txt;
        userDiv.innerHTML = userHtml;
        chatContainer.appendChild(userDiv);

        window.conversationHistory.push({
          role: "user",
          content: txt,
          image: currentAttachment ? currentAttachment.base64 : null
        });
        saveHistoryToStorage();

        messageInput.value = "";
        clearAttachment();
        chatContainer.scrollTop = chatContainer.scrollHeight;

        const loadingDiv = document.createElement('div');
        loadingDiv.className = "msg-loading";
        loadingDiv.innerText = "Radam Nox está pensando...";
        chatContainer.appendChild(loadingDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        abortController = new AbortController();

        try {
          const endpoint = `${BACKEND_URL.replace(/\/$/, '')}/api/chat`;
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            bo
