<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radamn AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-slate-900/50 backdrop-blur">
        <div class="flex items-center space-x-2">
            <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
            <h1 class="font-bold text-lg tracking-wide text-white">Radamn AI</h1>
        </div>
        <button onclick="novoProjeto()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 transition">
            + Novo Projeto
        </button>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col space-y-4">

        <!-- Mode Selector -->
        <div class="grid grid-cols-3 gap-2 bg-slate-900 p-1.5 rounded-xl border border-slate-800">
            <button onclick="setMode('gerar')" id="btn-gerar" class="py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-wand-magic-sparkles"></i> <span>Gerar</span>
            </button>
            <button onclick="setMode('refine')" id="btn-refine" class="py-2 text-sm font-medium rounded-lg text-slate-400 hover:text-white transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-sliders"></i> <span>Refinar</span>
            </button>
            <button onclick="setMode('chat')" id="btn-chat" class="py-2 text-sm font-medium rounded-lg text-slate-400 hover:text-white transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-comments"></i> <span>Chat</span>
            </button>
        </div>

        <!-- Input Box -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col space-y-3 shadow-lg">
            <textarea id="prompt-input" rows="3" placeholder="Descreva a interface ou faça uma pergunta..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition resize-none text-sm"></textarea>
            
            <div class="flex items-center justify-between">
                <span id="current-mode-label" class="text-xs text-slate-400 font-medium px-1">Modo: Gerar</span>
                <button onclick="enviarPrompt()" id="submit-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-xl text-sm font-medium transition flex items-center space-x-2 shadow-md shadow-indigo-600/20">
                    <span>Enviar</span> <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </div>
        </div>

        <!-- Local History -->
        <div class="bg-slate-900/60 border border-slate-800/80 rounded-xl p-3">
            <div class="flex items-center justify-between mb-2">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Histórico Local</h3>
                <button onclick="limparHistorico()" class="text-xs text-rose-400 hover:text-rose-300 transition">Limpar</button>
            </div>
            <div id="history-list" class="flex gap-2 overflow-x-auto pb-1 text-xs">
                <span class="text-slate-500 italic">Sem histórico recente.</span>
            </div>
        </div>

        <!-- Output / Preview Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl flex flex-col overflow-hidden shadow-xl flex-1 min-h-[400px]">
            <!-- Toolbar -->
            <div class="flex items-center justify-between px-4 py-2.5 bg-slate-900/90 border-b border-slate-800 text-xs">
                <div class="flex space-x-1">
                    <button onclick="switchTab('preview')" id="tab-preview" class="px-3 py-1.5 rounded-lg bg-slate-800 text-white font-medium transition">Preview ao Vivo</button>
                    <button onclick="switchTab('code')" id="tab-code" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition">Código Fonte</button>
                </div>
                <div class="flex space-x-2">
                    <button onclick="copiarCodigo()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition flex items-center space-x-1.5">
                        <i class="fa-regular fa-copy"></i> <span>Copiar</span>
                    </button>
                    <button onclick="baixarHtml()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition flex items-center space-x-1.5">
                        <i class="fa-solid fa-download"></i> <span>Baixar</span>
                    </button>
                    <button onclick="expandirPreview()" class="bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-400 px-3 py-1.5 rounded-lg transition flex items-center space-x-1.5 border border-indigo-500/30">
                        <i class="fa-solid fa-expand"></i> <span>Expandir</span>
                    </button>
                </div>
            </div>

            <!-- Content View -->
            <div class="relative flex-1 bg-slate-950 flex flex-col">
                <!-- Iframe Preview -->
                <div id="view-preview" class="absolute inset-0 w-full h-full flex flex-col">
                    <iframe id="preview-frame" class="w-full h-full border-0 bg-white"></iframe>
                </div>
                <!-- Code View -->
                <div id="view-code" class="absolute inset-0 w-full h-full p-4 overflow-auto hidden">
                    <pre><code id="code-output" class="text-xs font-mono text-indigo-300">Aguardando geração de código...</code></pre>
                </div>
            </div>
        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        let currentMode = 'gerar';
        let latestCode = '';
        let historyData = JSON.parse(localStorage.getItem('radamn_history') || '[]');

        function setMode(mode) {
            currentMode = mode;
            ['gerar', 'refine', 'chat'].forEach(m => {
                const btn = document.getElementById(`btn-${m}`);
                if (m === mode) {
                    btn.className = "py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white transition flex items-center justify-center space-x-2 shadow-md shadow-indigo-600/20";
                } else {
                    btn.className = "py-2 text-sm font-medium rounded-lg text-slate-400 hover:text-white transition flex items-center justify-center space-x-2";
                }
            });
            document.getElementById('current-mode-label').innerText = `Modo: ${mode.charAt(0).toUpperCase() + mode.slice(1)}`;
        }

        function switchTab(tab) {
            if (tab === 'preview') {
                document.getElementById('tab-preview').className = "px-3 py-1.5 rounded-lg bg-slate-800 text-white font-medium transition";
                document.getElementById('tab-code').className = "px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition";
                document.getElementById('view-preview').classList.remove('hidden');
                document.getElementById('view-code').classList.add('hidden');
            } else {
                document.getElementById('tab-code').className = "px-3 py-1.5 rounded-lg bg-slate-800 text-white font-medium transition";
                document.getElementById('tab-preview').className = "px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition";
                document.getElementById('view-code').classList.remove('hidden');
                document.getElementById('view-preview').classList.add('hidden');
            }
        }

        async function enviarPrompt() {
            const promptInput = document.getElementById('prompt-input');
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>A gerar...</span>`;

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: prompt,
                        mode: currentMode,
                        currentCode: latestCode
                    })
                });

                const data = await response.json();
                
                latestCode = data.code || '<div>Sem código gerado.</div>';
                
                // Renderiza no iframe
                const frame = document.getElementById('preview-frame');
                const frameDoc = frame.contentDocument || frame.contentWindow.document;
                frameDoc.open();
                frameDoc.write(latestCode);
                frameDoc.close();

                // Mostra no painel de código
                document.getElementById('code-output').innerText = latestCode;

                // Salva no histórico local
                const timestamp = new Date().toLocaleTimeString();
                historyData.unshift({ prompt, code: latestCode, time: timestamp });
                if (historyData.length > 15) historyData.pop();
                localStorage.setItem('radamn_history', JSON.stringify(historyData));
                renderHistory();

                promptInput.value = '';
                switchTab('preview');

            } catch (err) {
                alert('Erro ao comunicar com o servidor: ' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Enviar</span> <i class="fa-solid fa-paper-plane text-xs"></i>`;
            }
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            if (historyData.length === 0) {
                list.innerHTML = `<span class="text-slate-500 italic">Sem histórico recente.</span>`;
                return;
            }
            list.innerHTML = historyData.map((item, index) => `
                <button onclick="carregarHistorico(${index})" class="flex-shrink-0 bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition text-left max-w-[200px] truncate">
                    <span class="text-indigo-400 font-mono">${item.time}</span> - ${item.prompt}
                </button>
            `).join('');
        }

        function carregarHistorico(index) {
            const item = historyData[index];
            if (!item) return;
            latestCode = item.code;
            
            const frame = document.getElementById('preview-frame');
            const frameDoc = frame.contentDocument || frame.contentWindow.document;
            frameDoc.open();
            frameDoc.write(latestCode);
            frameDoc.close();

            document.getElementById('code-output').innerText = latestCode;
            switchTab('preview');
        }

        function limparHistorico() {
            historyData = [];
            localStorage.removeItem('radamn_history');
            renderHistory();
        }

        function novoProjeto() {
            latestCode = '';
            document.getElementById('prompt-input').value = '';
            document.getElementById('code-output').innerText = 'Aguardando geração de código...';
            const frame = document.getElementById('preview-frame');
            const frameDoc = frame.contentDocument || frame.contentWindow.document;
            frameDoc.open();
            frameDoc.write('<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#64748b;">Novo projeto pronto. Envie um prompt!</div>');
            frameDoc.close();
        }

        function copiarCodigo() {
            navigator.clipboard.writeText(latestCode);
            alert('Código copiado para a área de transferência!');
        }

        function baixarHtml() {
            const blob = new Blob([latestCode], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'radamn-project.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        function expandirPreview() {
            const newWindow = window.open();
            newWindow.document.write(latestCode);
            newWindow.document.close();
        }

        // Inicializa histórico ao carregar
        renderHistory();
    </script>
</body>
</html>
