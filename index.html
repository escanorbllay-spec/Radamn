<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radam Nox</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #0f0f15;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 15px;
      background-color: #161622;
      border-bottom: 1px solid #28283d;
      text-align: center;
      font-weight: bold;
      color: #8a5cf6;
    }
    #chatContainer {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.4;
      word-break: break-word;
    }
    .user-msg {
      align-self: flex-end;
      background-color: #2563eb;
      color: #fff;
    }
    .ai-msg {
      align-self: flex-start;
      background-color: #1e1e2d;
      color: #e2e8f0;
      border: 1px solid #2d2d42;
    }
    .chat-img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: block;
    }
    #imagePreviewContainer {
      display: none;
      padding: 8px 15px;
      background-color: #161622;
      border-top: 1px solid #28283d;
      align-items: center;
      gap: 10px;
    }
    #imagePreview {
      max-height: 60px;
      border-radius: 6px;
    }
    .remove-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    footer {
      padding: 10px;
      background-color: #161622;
      border-top: 1px solid #28283d;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #2d2d42;
      background-color: #0f0f15;
      color: #fff;
      outline: none;
    }
    button.action-btn {
      padding: 12px;
      background-color: #8a5cf6;
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    button.attach-btn {
      padding: 12px;
      background-color: #2d2d42;
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    Radam Nox (Memória Ativa)
  </header>

  <div id="chatContainer"></div>

  <div id="imagePreviewContainer">
    <img id="imagePreview" src="" alt="Preview">
    <button type="button" class="remove-btn" onclick="clearSelectedImage()">✕ Remover</button>
  </div>

  <footer>
    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
    <button type="button" class="attach-btn" onclick="document.getElementById('fileInput').click()">📎</button>
    <input type="text" id="messageInput" placeholder="Pergunte qualquer coisa ao Radam Nox..." onkeypress="handleKeyPress(event)">
    <button type="button" class="action-btn" onclick="sendMessage()">Enviar</button>
  </footer>

  <script>
    const BACKEND_URL = "https://radamn.onrender.com";
    let selectedBase64Image = null;
    
    // Armazena todas as interações da sessão atual
    window.conversationHistory = [];

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        selectedBase64Image = e.target.result;
        document.getElementById('imagePreview').src = selectedBase64Image;
        document.getElementById('imagePreviewContainer').style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function clearSelectedImage() {
      selectedBase64Image = null;
      document.getElementById('fileInput').value = '';
      document.getElementById('imagePreviewContainer').style.display = 'none';
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    function renderMessage(text, imageBase64, isUser) {
      const chatContainer = document.getElementById('chatContainer');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${isUser ? 'user-msg' : 'ai-msg'}`;

      if (imageBase64) {
        const imgEl = document.createElement('img');
        imgEl.src = imageBase64;
        imgEl.className = 'chat-img';
        msgDiv.appendChild(imgEl);
      }

      if (text) {
        const textEl = document.createElement('p');
        textEl.textContent = text;
        msgDiv.appendChild(textEl);
      }

      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function sendMessage() {
      const inputEl = document.getElementById('messageInput');
      const messageText = inputEl.value.trim();

      if (!messageText && !selectedBase64Image) return;

      const currentImage = selectedBase64Image;
      renderMessage(messageText, currentImage, true);

      // Prepara a entrada do usuário
      let userEntryContent = messageText;
      if (currentImage) {
        userEntryContent = [];
        if (messageText) userEntryContent.push({ type: "text", text: messageText });
        userEntryContent.push({ type: "image_url", image_url: { url: currentImage } });
      }

      // Adiciona a mensagem atual ao histórico global
      window.conversationHistory.push({
        role: "user",
        content: userEntryContent
      });

      inputEl.value = '';
      clearSelectedImage();

      try {
        const endpoint = `${BACKEND_URL.replace(/\/$/, '')}/api/chat`;
        
        // Envia o array de histórico completo
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: window.conversationHistory,
            message: messageText
          })
        });

        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error || 'Erro na resposta do servidor.');
        }

        const reply = data.reply || data.message || data.text || 'Sem resposta recebida.';
        
        // Adiciona a resposta da IA ao histórico global
        window.conversationHistory.push({
          role: "assistant",
          content: reply
        });

        renderMessage(reply, null, false);
      } catch (err) {
        console.error('Erro de conexão:', err);
        renderMessage(`Erro do Servidor: ${err.message || 'Não foi possível conectar ao Radam Nox.'}`, null, false);
      }
    }
  </script>
</body>
</html>
