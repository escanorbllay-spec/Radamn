<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Radamn AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0b0f19; color: #f3f4f6; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    
    /* Header */
    header { background: #111827; padding: 1rem; text-align: center; border-bottom: 1px solid #1f2937; display: flex; align-items: center; justify-content: center; gap: 10px; }
    header .logo { font-size: 1.25rem; font-weight: 700; background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    header .status { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; display: inline-block; }

    /* Área de Chat */
    #chat-box { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
    
    /* Boas-vindas */
    .welcome-card { text-align: center; margin: auto 0; padding: 2rem 1rem; }
    .welcome-card h2 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #fff; }
    .welcome-card p { color: #9ca3af; font-size: 0.95rem; line-height: 1.5; }

    /* Mensagens */
    .msg { max-width: 85%; padding: 0.85rem 1.1rem; border-radius: 16px; font-size: 0.95rem; line-height: 1.5; word-break: break-word; animation: fadeIn 0.2s ease-in-out; }
    .user { align-self: flex-end; background: #4f46e5; color: #ffffff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: #1f2937; color: #e5e7eb; border-bottom-left-radius: 4px; border: 1px solid #374151; white-space: pre-wrap; }

    /* Input & Formulário */
    form { padding: 0.75rem 1rem; background: #111827; border-top: 1px solid #1f2937; display: flex; gap: 0.5rem; align-items: center; }
    input { flex: 1; padding: 0.85rem 1rem; border-radius: 12px; border: 1px solid #374151; background: #1f2937; color: #fff; font-size: 0.95rem; outline: none; transition: border 0.2s; }
    input:focus { border-color: #6366f1; }
    button { padding: 0.85rem 1.25rem; border: none; border-radius: 12px; background: #4f46e5; color: #fff; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:active { background: #4338ca; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <span class="status"></span>
    <span class="logo">Radamn AI</span>
  </header>

  <div id="chat-box">
    <div class="welcome-card" id="welcome">
      <h2>Como posso ajudar você hoje?</h2>
      <p>Digite uma mensagem abaixo para iniciar a conversa com a IA.</p>
    </div>
  </div>

  <form id="chat-form">
    <input type="text" id="prompt-input" placeholder="Digite sua mensagem..." required autocomplete="off" />
    <button type="submit" id="send-btn">Enviar</button>
  </form>

  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('prompt-input');
    const chatBox = document.getElementById('chat-box');
    const btn = document.getElementById('send-btn');
    const welcome = document.getElementById('welcome');

    function appendMessage(text, className) {
      if (welcome) welcome.style.display = 'none';
      
      const div = document.createElement('div');
      div.className = `msg ${className}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = input.value.trim();
      if (!prompt) return;

      appendMessage(prompt, 'user');
      input.value = '';
      btn.disabled = true;

      const loadingMsg = appendMessage('Pensando...', 'bot');

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });
        
        const data = await res.json();
        loadingMsg.textContent = data.text || data.code || 'Sem resposta recebida da IA.';
      } catch (err) {
        loadingMsg.textContent = 'Erro ao se comunicar com a IA. Tente novamente.';
      } finally {
        btn.disabled = false;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    });
  </script>
</body>
</html>
