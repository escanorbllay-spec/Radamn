<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radamn AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 1rem; background: #1e293b; text-align: center; font-weight: bold; font-size: 1.2rem; border-bottom: 1px solid #334155; }
    #chat-box { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; }
    .msg { max-width: 80%; padding: 0.75rem 1rem; border-radius: 12px; line-height: 1.4; word-break: break-word; }
    .user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 2px; }
    .bot { align-self: flex-start; background: #334155; color: #f8fafc; border-bottom-left-radius: 2px; white-space: pre-wrap; }
    form { display: flex; padding: 0.75rem; background: #1e293b; gap: 0.5rem; border-top: 1px solid #334155; }
    input { flex: 1; padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; outline: none; }
    button { padding: 0.75rem 1.25rem; border: none; border-radius: 8px; background: #2563eb; color: #fff; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <header>Radamn AI Chat</header>
  <div id="chat-box"></div>
  <form id="chat-form">
    <input type="text" id="prompt-input" placeholder="Digite sua mensagem..." required autocomplete="off" />
    <button type="submit" id="send-btn">Enviar</button>
  </form>

  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('prompt-input');
    const chatBox = document.getElementById('chat-box');
    const btn = document.getElementById('send-btn');

    function appendMessage(text, className) {
      const div = document.createElement('div');
      div.className = `msg ${className}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = input.value.trim();
      if (!prompt) return;

      appendMessage(prompt, 'user');
      input.value = '';
      btn.disabled = true;

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });
        const data = await res.json();
        appendMessage(data.text || data.code || 'Sem resposta recebida.', 'bot');
      } catch (err) {
        appendMessage('Erro ao se comunicar com a IA.', 'bot');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
